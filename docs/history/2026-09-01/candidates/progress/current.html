<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Converging Waters — REV24 recovery transport</title><style>html,body{margin:0;min-height:100%;background:#f5efe6;color:#13251d;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.status{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}.status div{max-width:720px;background:#fffdf8;border:1px solid #e4dccf;border-radius:28px;padding:32px}</style></head><body><div class="status"><div><b>Converging Waters</b><br><span>Loading REV24 recovery review…</span></div></div><script>(()=>{const files=['rev24-recovery-00.txt','rev24-recovery-01.txt','rev24-recovery-02-03.txt','rev24-recovery-04-05.txt','rev24-recovery-06-07.txt','rev24-recovery-08-09.txt'],expected='50f69031f11af071fb7d0938a8951d32fc7a17fbd0126e31233f25a62fb40260';const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');(async()=>{try{const parts=[];for(const n of files){const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n+' '+r.status);parts.push((await r.text()).trim())}const packed=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));if(typeof DecompressionStream!=='function')throw new Error('Browser lacks DecompressionStream support');const html=await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const got=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)));if(got!==expected)throw new Error('REV24 recovery integrity mismatch: '+got);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="status"><div><b>REV24 recovery transport could not load</b><br><span>'+String(e.message||e)+'</span></div></div>'}})()})();</script></body></html>
