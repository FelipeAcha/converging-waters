<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Converging Waters</title><style>html,body{margin:0;min-height:100%;background:#f4f1e8;color:#17372f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{min-height:100vh;display:grid;place-items:center;padding:2rem;text-align:center}.loading strong{display:block;font-size:1.1rem;margin-bottom:.4rem}</style></head><body><div class="loading"><div><strong>Converging Waters</strong>Loading published working synthesis...</div></div><script>(async()=>{try{const p=location.pathname;let key='hub',prefix='payload/';if(p.includes('/deep-dives/rights-of-nature')){key='rights';prefix='../../payload/'}else if(p.includes('/deep-dives/river-observatory')){key='observatory';prefix='../../payload/'}else if(p.includes('/deep-dives/river-economy')){key='economy';prefix='../../payload/'}const counts={hub:17,rights:5,observatory:3,economy:3};const parts=await Promise.all(Array.from({length:counts[key]},(_,i)=>fetch(prefix+key+'-'+String(i).padStart(2,'0')+'.txt',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status+' '+r.url);return r.text()})));const b64=parts.join('').replace(/\s+/g,'');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><strong>Converging Waters</strong>Unable to load the published synthesis.<br><small>'+String(e).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</small></div></div>';console.error(e)}})();</script></body></html>
