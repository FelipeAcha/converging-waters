<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converging Waters — v13 review release</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#174d39">
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f5efe6;color:#10261d;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.loading{max-width:38rem;padding:2rem;text-align:center}.spinner{width:2.5rem;height:2.5rem;margin:0 auto 1rem;border:.25rem solid #d8c9ad;border-top-color:#174d39;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{max-width:42rem;padding:2rem;text-align:left}.error code{overflow-wrap:anywhere}
</style>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.8.3/umd/index.js"></script>
</head>
<body>
<div class="loading"><div class="spinner" aria-hidden="true"></div><strong>Loading Converging Waters v13…</strong><p>Verifying and opening the reviewed website with its optimized visual assets.</p></div>
<script>
(async()=>{
  const ZIP_URL='https://raw.githubusercontent.com/FelipeAcha/converging-waters/main/converging-waters-repository-ready.zip';
  const EXPECTED_SHA256='cf0a0e2f78ccf0ca370735c285cb1cbe19515c44bffabbb87424a0cda7efafb1';
  const response=await fetch(ZIP_URL,{cache:'no-store'});
  if(!response.ok) throw new Error(`Unable to fetch reviewed package: HTTP ${response.status}`);
  const zipBytes=new Uint8Array(await response.arrayBuffer());
  const digest=[...new Uint8Array(await crypto.subtle.digest('SHA-256',zipBytes))].map(b=>b.toString(16).padStart(2,'0')).join('');
  if(digest!==EXPECTED_SHA256) throw new Error('Reviewed package integrity check failed.');
  if(!window.fflate) throw new Error('The decompression library did not load.');
  const entries=fflate.unzipSync(zipBytes);
  const decoder=new TextDecoder();
  const htmlPath='docs/releases/v13/index.html';
  if(!entries[htmlPath]) throw new Error('The reviewed package does not contain the v13 HTML file.');
  let html=decoder.decode(entries[htmlPath]);
  const assetPrefix='docs/releases/v13/assets/';
  for(const [path,bytes] of Object.entries(entries)){
    if(!path.startsWith(assetPrefix)) continue;
    const name=path.slice(assetPrefix.length);
    const ext=name.split('.').pop().toLowerCase();
    const mime=ext==='svg'?'image/svg+xml':ext==='webp'?'image/webp':'application/octet-stream';
    const objectUrl=URL.createObjectURL(new Blob([bytes],{type:mime}));
    html=html.split(`assets/${name}`).join(objectUrl);
  }
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  document.body.innerHTML='<main class="error"><h1>Unable to load the reviewed website</h1><p>'+String(error.message||error)+'</p><p><code>https://github.com/FelipeAcha/converging-waters</code></p></main>';
  console.error(error);
});
</script>
</body>
</html>
