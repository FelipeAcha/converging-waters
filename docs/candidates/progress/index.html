<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converging Waters — Rolling Progress Preview</title>
<meta name="robots" content="noindex,nofollow">
<style>
html,body{margin:0;height:100%;background:#f5efe6;color:#13251d;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
#cw-progress-banner{flex:0 0 auto;padding:10px 16px;background:#10261d;color:white;font:800 13px/1.35 Inter,system-ui,sans-serif;border-bottom:1px solid rgba(255,255,255,.16)}
#cw-progress-banner b{color:#efd488}
#cw-progress-frame{flex:1 1 auto;width:100%;border:0;background:#f5efe6}
#cw-progress-error{display:none;flex:1;place-items:center;padding:30px;text-align:center}
#cw-progress-error div{max-width:720px;background:#fffdf8;border:1px solid #e4dccf;border-radius:28px;padding:32px;box-shadow:0 18px 48px rgba(16,38,29,.12)}
#cw-progress-error b{display:block;font-size:1.5rem;margin-bottom:8px}#cw-progress-error span{color:#647368}
</style>
</head>
<body>
<div id="cw-progress-banner"><b>v16.5 APPROVED · cumulative progress preview</b> · approved content through #system. Downstream sections remain preserved in the candidate and are hidden only in this review transport.</div>
<iframe id="cw-progress-frame" src="../v16.5/" title="Converging Waters cumulative progress through v16.5"></iframe>
<div id="cw-progress-error"><div><b>Preview could not load</b><span id="cw-progress-error-text"></span></div></div>
<script>
(() => {
  const frame = document.getElementById('cw-progress-frame');
  const errorBox = document.getElementById('cw-progress-error');
  const errorText = document.getElementById('cw-progress-error-text');
  const FRONTIER_ID = 'system';
  let attempts = 0;

  function fail(message){
    frame.style.display = 'none';
    errorBox.style.display = 'grid';
    errorText.textContent = String(message || 'unknown error');
  }

  function applyFrontier(){
    attempts += 1;
    try {
      const doc = frame.contentDocument;
      if (!doc) throw new Error('candidate document unavailable');
      const frontier = doc.querySelector('#' + FRONTIER_ID);
      const stanley = doc.querySelector('#stanley-update');
      if (!frontier || !stanley) {
        if (attempts < 80) return setTimeout(applyFrontier, 100);
        throw new Error('approved candidate did not finish mounting');
      }

      const required = [
        'Pisac → Coya → Lamay → Calca → Huarán → Urubamba → Yanahuara → Pachar → Ollantaytambo',
        'Coya · COY-1',
        'Lamay · LAM-1',
        'Cusco–Huatanay: why the infrastructure matters',
        'YAN-0', 'PACH-HAT', 'OLL-1'
      ];
      if (required.some(t => !frontier.textContent.includes(t))) throw new Error('v16.5 approval content mismatch');
      if (stanley.querySelectorAll('img').length !== 13 || stanley.querySelectorAll('a').length !== 17) throw new Error('Stanley/WGA preservation mismatch');

      const sections = [...doc.querySelectorAll('main > section')];
      const frontierIndex = sections.findIndex(s => s.id === FRONTIER_ID);
      if (frontierIndex < 0) throw new Error('review frontier not found');
      sections.slice(frontierIndex + 1).forEach(s => s.hidden = true);
      const footer = doc.querySelector('footer');
      if (footer) footer.hidden = true;
      doc.querySelectorAll('.nav-links a[href^="#"]').forEach(a => {
        const target = doc.querySelector(a.getAttribute('href'));
        if (!target || target.hidden) a.hidden = true;
      });

      const style = doc.createElement('style');
      style.id = 'cw-progress-approved-frontier-style';
      style.textContent = `#${FRONTIER_ID}::after{content:"Approved review frontier — sections below this point remain preserved in v16.5 but are intentionally hidden until the next incremental review.";display:block;margin:30px auto 0;padding:14px 16px;max-width:900px;border:1px dashed #c9bda9;border-radius:16px;background:rgba(255,255,255,.55);color:#647368;font:700 13px/1.4 Inter,system-ui,sans-serif;letter-spacing:0}[hidden]{display:none!important}`;
      doc.head.appendChild(style);
    } catch (err) {
      fail(err.message || err);
    }
  }

  frame.addEventListener('load', () => setTimeout(applyFrontier, 50), {once:true});
  setTimeout(() => { if (!frame.contentDocument?.querySelector('#system') && attempts === 0) applyFrontier(); }, 500);
})();
</script>
</body>
</html>
