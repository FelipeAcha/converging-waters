<script>
(()=>{const frame=document.getElementById('frame'),box=document.getElementById('error'),msg=document.getElementById('error-text');let tries=0;function fail(e){frame.style.display='none';box.style.display='grid';msg.textContent=String(e||'unknown error')}function apply(){tries++;try{const doc=frame.contentDocument;if(!doc)throw new Error('candidate document unavailable');const frontier=doc.querySelector('#finance-hypotheses'),amazon=doc.querySelector('#amazonas-application'),tech=doc.querySelector('#technical-options'),bullet=doc.querySelector('#first-outcome .callout ul.clean li');if(!frontier||!amazon||!tech||!bullet||!doc.title.includes('v16.8 approved candidate')){if(tries<180)return setTimeout(apply,100);throw new Error('approved v16.8 did not finish mounting')}const color=frame.contentWindow.getComputedStyle(bullet).color;if(!/^rgba?\(255,\s*255,\s*255/.test(color))throw new Error('section-09 shared-callout contrast regression: '+color);if(!amazon.textContent.includes('Person / project / territory boundary')||!tech.textContent.includes('Technical authority boundary')||!frontier.textContent.includes('Simona / WGA boundary'))throw new Error('v16.8 approved content mismatch');const sections=[...doc.querySelectorAll('main > section')],i=sections.findIndex(s=>s.id==='finance-hypotheses');if(i<0)throw new Error('frontier not found');sections.slice(i+1).forEach(s=>s.hidden=true);const footer=doc.querySelector('footer');if(footer)footer.hidden=true;doc.querySelectorAll('.nav-links a[href^="#"]').forEach(a=>{const t=doc.querySelector(a.getAttribute('href'));if(!t||t.hidden)a.hidden=true});const style=doc.createElement('style');style.textContent='[hidden]{display:none!important}#finance-hypotheses::after{content:"Approved review frontier — downstream content remains preserved and awaits the next incremental review.";display:block;margin:30px auto 0;padding:14px 16px;max-width:900px;border:1px dashed #c9bda9;border-radius:16px;background:rgba(255,255,255,.55);color:#647368;font:700 13px/1.4 Inter,system-ui,sans-serif}';doc.head.appendChild(style)}catch(e){fail(e.message||e)}}frame.addEventListener('load',()=>setTimeout(apply,80),{once:true});setTimeout(()=>{if(tries===0)apply()},700)})();
</script></body></html>
