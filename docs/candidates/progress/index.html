<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Converging Waters — Rolling Progress Preview</title>
<style>
  html,body{margin:0;min-height:100%;background:#f5efe6;color:#13251d;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .cw-progress-loading{min-height:100vh;display:grid;place-items:center;padding:30px;text-align:center}
  .cw-progress-loading div{max-width:720px;background:#fffdf8;border:1px solid #e4dccf;border-radius:28px;padding:32px;box-shadow:0 18px 48px rgba(16,38,29,.12)}
  .cw-progress-loading b{display:block;font-size:1.5rem;margin-bottom:8px}.cw-progress-loading span{color:#647368}
</style>
</head>
<body>
<div class="cw-progress-loading"><div><b>Converging Waters</b><span>Loading the rolling review preview…</span></div></div>
<script>
(async () => {
  const SOURCE = '../v16.1.1/index.html';
  const VERSION = 'v16.5 PROPOSED · REV 2';
  const FRONTIER_ID = 'system';
  try {
    const res = await fetch(SOURCE, {cache: 'no-store'});
    if (!res.ok) throw new Error(`source HTTP ${res.status}`);
    const source = await res.text();
    const parsed = new DOMParser().parseFromString(source, 'text/html');

    const emerged = parsed.querySelector('#emerged-since-call');
    if (!emerged) throw new Error('missing #emerged-since-call');
    const wgaSummary = [...emerged.querySelectorAll('article.card')].find(card => card.querySelector('h3')?.textContent.trim() === "WGA's expanded field possibility");
    if (!wgaSummary) throw new Error('v16.2 target card not found');
    wgaSummary.remove();

    const thesis = parsed.querySelector('#thesis');
    if (!thesis) throw new Error('missing #thesis');
    const duplicateSequence = thesis.querySelector('.sequence');
    if (!duplicateSequence) throw new Error('v16.3 duplicate sequence not found');
    duplicateSequence.remove();

    const purposeMrv = parsed.querySelector('#purpose-mrv');
    if (!purposeMrv) throw new Error('missing #purpose-mrv');
    purposeMrv.hidden = true;
    purposeMrv.setAttribute('aria-hidden', 'true');

    const system = parsed.querySelector('#system');
    if (!system) throw new Error('missing #system');
    const systemTemplate = parsed.createElement('template');
    systemTemplate.innerHTML = `<section class="section" id="system">
<div class="container">
<div class="section-head">
<div>
<div class="kicker">07 · River system + candidate monitoring scope</div>
<h2>One river system. One confluence. A bounded first corridor.</h2>
</div>
<p>Separate where the collaboration may work, where evidence may need to be collected, and what the river connects downstream.</p>
</div>
<div class="note wide-note">
<b>Working naming convention</b>
<p><b>Willkamayu</b> is the Inka / Quechua name associated with the “sacred river.” Current institutional sources use <b>Vilcanota</b> and <b>Urubamba</b> for the same main river system across different stretches. This page therefore uses <b>Willkamayu / Vilcanota–Urubamba</b> when referring to the connected main stem as a whole.</p>
</div>
<div class="card-grid two" style="margin-top:18px">
<article class="card mint">
<div class="micro-title">Main stem before the confluence</div>
<h3>Upper Willkamayu / Vilcanota</h3>
<p>Headwaters and upper-basin conditions flow toward Huambutío. The main stem can be measured before it receives the Huatanay to establish an upstream reference.</p>
</article>
<article class="card blue">
<div class="micro-title">Tributary branch from Cusco</div>
<h3>Cusco → Huatanay</h3>
<p>Urban drainage, wastewater, tributaries and treatment infrastructure shape the Huatanay signal before it reaches the main river.</p>
</article>
</div>
<div class="card" style="margin-top:18px;border-color:#b8d8c4;background:#f3fbf5">
<div class="micro-title">Shared confluence node · one place, not two parallel steps</div>
<h3>Huambutío · Huatanay joins the Willkamayu / Vilcanota</h3>
<p>This is the mixing point. A candidate station just downstream can help estimate the combined condition before the river continues toward the Sacred Valley corridor.</p>
</div>
<div class="card" style="margin-top:18px;border-color:#d8c99e;background:#fffaf0">
<div class="micro-title">Candidate initial working / benefit corridor · proposed</div>
<h3>Pisac → Calca → Huarán → Urubamba → Pachar → Ollantaytambo</h3>
<p>This is a continuous first geography to validate with the team and territorial actors, not a finalized station list. Yanahuara lies between Urubamba and Pachar and remains a candidate additional or alternate sampling area; final station placement should follow hydrologic relevance, tributaries and discharges, access and community priorities rather than town spacing alone.</p>
</div>
<div class="flow" style="margin-top:18px">
<div class="flow-title">Candidate measurement logic · measurement geography may be larger than benefit geography</div>
<div class="flow-row four">
<div class="flow-box"><b>M1 · Upstream reference</b><span>Main stem before receiving the Huatanay.</span></div>
<div class="flow-box"><b>M2 · Tributary signal</b><span>Huatanay immediately before the confluence.</span></div>
<div class="flow-box"><b>M3 · Mixed signal</b><span>Main stem just below Huambutío.</span></div>
<div class="flow-box"><b>M4+ · Corridor sites</b><span>Representative points from Pisac through Ollantaytambo.</span></div>
</div>
</div>
<div class="note wide-note" style="margin-top:18px">
<b>Open team decision · Cusco / Huatanay</b>
<p>Source attribution may justify measuring the Huatanay from the beginning even if the first benefit corridor remains in the Sacred Valley. A separate decision is whether citizen science and active territorial work in Cusco enter <b>Phase 1</b> or remain a <b>Phase 2</b> expansion.</p>
</div>
<div class="callout slim-callout" style="margin-top:18px;background:linear-gradient(135deg,#243b33,#355d52)">
<div class="micro-title" style="color:#efd488">Hydrological continuity · implication, not project footprint</div>
<h3>Lower Urubamba → Atalaya → Ucayali → Amazon → Atlantic</h3>
<p>The main stem continues downstream as the Urubamba. At Atalaya, the Urubamba meets the Tambo and forms the Ucayali; the Ucayali later meets the Marañón to form the Amazon, which reaches the Atlantic. This continuity explains why local river recovery can have wider downstream implications without implying that Converging Waters will monitor, govern or intervene across that entire system.</p>
</div>
<div class="note wide-note" style="margin-top:18px">
<b>Huatanay infrastructure context</b>
<p>The relevant infrastructure project is the <b>PTAR Cusco / San Jerónimo expansion</b>, not an unspecified “US$46M project.” A 2023 ProInversión source documented a 580 L/s design capacity, peak inflows above 800 L/s and a proposed increase toward 938 L/s. Public investment estimates have changed materially since then, so this page does not freeze the old dollar figure. <a href="https://www.gob.pe/institucion/sunass/noticias/1205134-sunass-fiscaliza-planta-de-tratamiento-de-aguas-residuales-en-cusco-para-verificar-calidad-del-vertimiento-al-rio-huatanay" rel="noopener noreferrer" target="_blank">SUNASS context</a> · <a href="https://www.gob.pe/institucion/proinversion/noticias/820703-se-ampliara-y-mejorara-la-ptar-san-jeronimo-de-cusco-con-una-inversion-estimada-de-us-46-millones" rel="noopener noreferrer" target="_blank">2023 ProInversión baseline</a> · <a href="#validation">validation backlog</a>.</p>
</div>
</div>
</section>`;
    system.replaceWith(systemTemplate.content.firstElementChild);

    const mainSections = [...parsed.querySelectorAll('main > section')];
    const frontierIndex = mainSections.findIndex(s => s.id === FRONTIER_ID);
    if (frontierIndex < 0) throw new Error('review frontier not found');
    mainSections.slice(frontierIndex + 1).forEach(s => s.hidden = true);
    const footer = parsed.querySelector('footer');
    if (footer) footer.hidden = true;

    parsed.querySelectorAll('[src^="assets/"]').forEach(el => el.setAttribute('src', '../v16.1.1/' + el.getAttribute('src')));
    parsed.querySelectorAll('link[href^="assets/"]').forEach(el => el.setAttribute('href', '../v16.1.1/' + el.getAttribute('href')));
    parsed.querySelectorAll('.nav-links a[href^="#"]').forEach(a => { const target = parsed.querySelector(a.getAttribute('href')); if (!target || target.hidden) a.hidden = true; });

    const transportStyle = parsed.createElement('style');
    transportStyle.id = 'cw-progress-transport-style';
    transportStyle.textContent = `#cw-progress-banner{position:sticky;top:0;z-index:9999;padding:10px 16px;background:#10261d;color:white;font:800 13px/1.35 Inter,system-ui,sans-serif;border-bottom:1px solid rgba(255,255,255,.16)}#cw-progress-banner b{color:#efd488}.header{top:38px!important}#${FRONTIER_ID}::after{content:"Review frontier — sections below this point remain preserved in the candidate but are intentionally hidden until we work on them.";display:block;margin:30px auto 0;padding:14px 16px;max-width:900px;border:1px dashed #c9bda9;border-radius:16px;background:rgba(255,255,255,.55);color:#647368;font:700 13px/1.4 Inter,system-ui,sans-serif;letter-spacing:0}[hidden]{display:none!important}`;
    parsed.head.appendChild(transportStyle);

    const banner = parsed.createElement('div');
    banner.id = 'cw-progress-banner';
    banner.innerHTML = `<b>${VERSION} · cumulative progress preview</b> · approved v16.1.1 + v16.2 + v16.3 + v16.4, with revised v16.5 proposed. Downstream unreviewed sections are hidden only in this review transport.`;
    parsed.body.insertBefore(banner, parsed.body.firstChild);
    parsed.title = 'Converging Waters — ' + VERSION + ' Rolling Progress';

    document.head.innerHTML = parsed.head.innerHTML;
    document.body.innerHTML = parsed.body.innerHTML;

    const stanley = document.querySelector('#stanley-update');
    if (!stanley || stanley.querySelectorAll('img').length !== 13 || stanley.querySelectorAll('a').length !== 17) throw new Error('Stanley/WGA preservation mismatch');
    if (document.querySelectorAll('a[href^="http://"],a[href^="https://"]').length !== 46) throw new Error('external href count mismatch');
    if ([...document.querySelectorAll('#emerged-since-call h3')].some(h => h.textContent.trim() === "WGA's expanded field possibility")) throw new Error('v16.2 duplicate still visible');
    if (document.querySelector('#thesis .sequence')) throw new Error('v16.3 duplicate sequence still present');
    if (document.body.textContent.split('Listen → Measure → Train → Pilot → Mandate → File or legislate').length - 1 !== 1) throw new Error('territorial sequence count mismatch');
    const mountedPurpose = document.querySelector('#purpose-mrv');
    if (!mountedPurpose || !mountedPurpose.hidden || mountedPurpose.getAttribute('aria-hidden') !== 'true') throw new Error('v16.4 purpose-MRV shell not hidden');
    const mountedSystem = document.querySelector('#system');
    if (!mountedSystem || !mountedSystem.textContent.includes('Pisac → Calca → Huarán → Urubamba → Pachar → Ollantaytambo')) throw new Error('v16.5 corridor order mismatch');
    if (!mountedSystem.textContent.includes('Yanahuara lies between Urubamba and Pachar')) throw new Error('v16.5 Yanahuara/Pachar note missing');
    if (!mountedSystem.textContent.includes('Huambutío · Huatanay joins the Willkamayu / Vilcanota')) throw new Error('v16.5 shared confluence node missing');
    if (mountedSystem.textContent.split('Huambutío · Huatanay joins the Willkamayu / Vilcanota').length - 1 !== 1) throw new Error('duplicate shared Huambutío node');
    if (mountedSystem.textContent.includes('estimated US$46M project')) throw new Error('stale US$46M label remains');
    if ([...mountedSystem.querySelectorAll('h3')].some(h => ['Primary working scope','Measurement can extend upstream','No scope inflation','Capacity pressure'].includes(h.textContent.trim()))) throw new Error('redundant v16.5 rev1 cards remain');
    if (!mountedSystem.textContent.includes('PTAR Cusco / San Jerónimo expansion')) throw new Error('PTAR project clarification missing');
    if (!mountedSystem.textContent.includes('Lower Urubamba → Atalaya → Ucayali → Amazon → Atlantic')) throw new Error('downstream continuity missing');
  } catch (err) {
    document.body.innerHTML = `<div class="cw-progress-loading"><div><b>Preview could not load</b><span>${String(err.message || err)}</span></div></div>`;
  }
})();
</script>
</body>
</html>
