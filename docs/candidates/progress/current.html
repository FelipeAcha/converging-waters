<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Converging Waters — REV30 cumulative review</title><style>html,body{margin:0;min-height:100%;background:#f5efe6;color:#13251d;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}.status{min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center}.status div{max-width:720px;background:#fffdf8;border:1px solid #e4dccf;border-radius:28px;padding:32px}</style></head><body><div class="status"><div><b>Converging Waters</b><br><span>Loading REV30 hub review…</span></div></div><script>(()=>{const files=["rev30-hub-00.txt","rev30-hub-01.txt","rev30-hub-02.txt","rev30-hub-03.txt","rev30-hub-04.txt","rev30-hub-05.txt"],expected='7b38d1392b9dc04e5fd8ca785d1ba3f010a21f0e887a094da7830c7ad36b7a76';const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');(async()=>{try{const parts=[];for(const n of files){const q=await fetch(n,{cache:'no-store'});if(!q.ok)throw new Error(n+' '+q.status);parts.push((await q.text()).trim())}const packed=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));if(typeof DecompressionStream!=='function')throw new Error('Browser lacks DecompressionStream support');const html=await new Response(new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'))).text();const got=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(html)));if(got!==expected)throw new Error('Integrity mismatch: '+got);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="status"><div><b>Review transport could not load</b><br><span>'+String(e.message||e)+'</span></div></div>'}})()})();</script></body></html>
