<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Converging Waters — REV33</title></head><body><p style="font-family:system-ui;padding:24px">Loading REV33…</p><script>
const parts=["payload-00.b64", "payload-01.b64"];
Promise.all(parts.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(p+' '+r.status);return r.text()}))).then(async xs=>{const b64=xs.join('');const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([u]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close();}).catch(e=>{document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px;font-family:system-ui;color:#8b1e1e">REV33 transport failed: '+String(e)+'</pre>';});
</script></body></html>
