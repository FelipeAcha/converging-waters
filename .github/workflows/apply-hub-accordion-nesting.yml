name: Apply hub accordion nesting
on:
  push:
    branches:
      - fix/hub-accordion-nesting-20260829
    paths:
      - .github/workflows/apply-hub-accordion-nesting.yml
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/hub-accordion-nesting-20260829
      - name: Build and validate nesting-only candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,re
          d=Path('docs/payload'); parts=[d/f'hub-{i:02d}.txt' for i in range(17)]
          b64=re.sub(r'\s+','',''.join(p.read_text(encoding='ascii') for p in parts)); b64+='='*(-len(b64)%4)
          baseline=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          baseline_sha=hashlib.sha256(baseline.encode()).hexdigest()
          if baseline_sha!='34424f9a914dc45d9ea387d094aca5d17f4a846e15131ea751ccbc1266f03afa': raise SystemExit('Baseline drift: '+baseline_sha)

          def sec(src,sid):
              m=re.search(r'<section\b[^>]*\bid=["\']'+re.escape(sid)+r'["\'][^>]*>',src,re.I)
              if not m: raise RuntimeError('missing '+sid)
              tok=re.compile(r'</?section\b[^>]*>',re.I); depth=0
              for t in tok.finditer(src,m.start()):
                  if t.group(0).lower().startswith('</'):
                      depth-=1
                      if depth==0:return m.start(),t.end(),src[m.start():t.end()]
                  else: depth+=1
              raise RuntimeError('unclosed '+sid)

          context='context'
          pairs={'people-authority-boundary':('people','03'),'evidence-to-implementation':('system','07'),'river-economy-overview':('what-we-need-now','10'),'people-guardians-stewardship':('alliance-architecture','14')}
          if baseline.count('id="context"')!=1: raise SystemExit('context count drift')
          raw_context=sec(baseline,context)[2]
          raw_a={a:sec(baseline,a)[2] for a in pairs}
          raw_p={p:sec(baseline,p)[2] for p,_ in pairs.values()}
          for a,(p,n) in pairs.items():
              if baseline.count(f'id="{a}"')!=1 or baseline.count(f'id="{p}"')!=1: raise SystemExit('id count drift '+a)

          candidate=baseline.replace(raw_context,'',1)
          a03=raw_a['people-authority-boundary']; candidate=candidate.replace(a03,'',1)
          p03=candidate.index(raw_p['people']); dt=re.compile(r'</?div\b[^>]*>',re.I); stack=[]
          for m in dt.finditer(candidate,0,p03):
              if m.group(0).lower().startswith('</'):
                  if stack: stack.pop()
              else: stack.append((m.start(),m.group(0)))
          ws=next((pos for pos,tag in reversed(stack) if 'cw-section-accordion' in tag),None)
          if ws is None: raise SystemExit('03 wrapper missing')
          depth=0; we=None
          for m in dt.finditer(candidate,ws):
              if m.group(0).lower().startswith('</'):
                  depth-=1
                  if depth==0: we=m.end(); break
              else: depth+=1
          if we is None: raise SystemExit('03 wrapper unclosed')
          candidate=candidate[:we]+a03+candidate[we:]

          old="""  const all=[...document.querySelectorAll('.cw-section-accordion')];\n  if(all.length!==23){console.error('Accordion contract failed.');return;}\n  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  all.forEach(box=>{\n    const button=box.querySelector(':scope>.cw-accordion-trigger');\n    const panel=box.querySelector(':scope>.cw-accordion-panel');\n    const source=[...panel.querySelectorAll('.kicker')].find(el=>/^\\s*\\d{2}\\s*[·•-]/.test(el.textContent||''));\n    if(!button||!panel||!source){console.error('Accordion source missing',box.dataset.cwSection);return;}\n    source.classList.add('cw-accordion-source-label'); source.hidden=true;\n    const finishOpen=()=>{panel.style.height='';panel.style.opacity='';panel.style.transition='';delete box.dataset.animating;};\n    const finishClose=()=>{panel.hidden=true;panel.style.height='';panel.style.opacity='';panel.style.transition='';delete box.dataset.animating;};\n    button.addEventListener('click',()=>{\n"""
          new="""  const all=[...document.querySelectorAll('.cw-section-accordion')];\n  if(all.length!==23){console.error('Accordion contract failed.');return;}\n  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const addonByParentId={people:'people-authority-boundary',system:'evidence-to-implementation','what-we-need-now':'river-economy-overview','alliance-architecture':'people-guardians-stewardship'};\n  all.forEach(box=>{\n    const button=box.querySelector(':scope>.cw-accordion-trigger');\n    const panel=box.querySelector(':scope>.cw-accordion-panel');\n    const source=[...panel.querySelectorAll('.kicker')].find(el=>/^\\s*\\d{2}\\s*[·•-]/.test(el.textContent||''));\n    if(!button||!panel||!source){console.error('Accordion source missing',box.dataset.cwSection);return;}\n    source.classList.add('cw-accordion-source-label'); source.hidden=true;\n    const parentSection=panel.querySelector(':scope>section');\n    const addonId=parentSection&&addonByParentId[parentSection.id];\n    const addon=addonId&&document.getElementById(addonId);\n    if(addon){addon.hidden=true;button.setAttribute('aria-controls',button.getAttribute('aria-controls')+' '+addon.id);}\n    const finishOpen=()=>{panel.style.height='';panel.style.opacity='';panel.style.transition='';delete box.dataset.animating;};\n    const finishClose=()=>{panel.hidden=true;if(addon)addon.hidden=true;panel.style.height='';panel.style.opacity='';panel.style.transition='';delete box.dataset.animating;};\n    button.addEventListener('click',()=>{\n"""
          old_reduce="""      if(reduced){\n        button.setAttribute('aria-expanded',String(opening));box.classList.toggle('is-open',opening);panel.hidden=!opening;return;\n      }\n"""
          new_reduce="""      if(reduced){\n        button.setAttribute('aria-expanded',String(opening));box.classList.toggle('is-open',opening);panel.hidden=!opening;if(addon)addon.hidden=!opening;return;\n      }\n"""
          old_open="""      if(opening){\n        panel.hidden=false;button.setAttribute('aria-expanded','true');box.classList.add('is-open');\n"""
          new_open="""      if(opening){\n        panel.hidden=false;if(addon)addon.hidden=false;button.setAttribute('aria-expanded','true');box.classList.add('is-open');\n"""
          for before,after,name in [(old,new,'main js'),(old_reduce,new_reduce,'reduced'),(old_open,new_open,'open')]:
              if candidate.count(before)!=1: raise SystemExit(name+' anchor drift')
              candidate=candidate.replace(before,after,1)

          old_indent='.cw-accordion-source-label{display:none!important}\n#collaboration-framework>.rev19-observatory-bridge'
          new_indent='.cw-accordion-source-label{display:none!important}\n.cw-rev18-late .cw-section-accordion[data-cw-section="14"]>.cw-accordion-trigger .cw-accordion-summary-inner.container{width:min(1220px,calc(100% - 44px))}\n#collaboration-framework>.rev19-observatory-bridge'
          if candidate.count(old_indent)!=1: raise SystemExit('14 indentation CSS anchor drift')
          candidate=candidate.replace(old_indent,new_indent,1)

          def stripped(src):
              out=src
              for sid in [context,*pairs.keys()]:
                  try: raw=sec(out,sid)[2]
                  except RuntimeError: continue
                  out=out.replace(raw,'',1)
              return out.replace(new,old,1).replace(new_reduce,old_reduce,1).replace(new_open,old_open,1).replace(new_indent,old_indent,1)
          if stripped(candidate)!=stripped(baseline): raise SystemExit('Untouched bytes changed')
          if 'id="context"' in candidate or 'This is a new moment' in candidate: raise SystemExit('Context remains')
          for a,(p,n) in pairs.items():
              if sec(candidate,a)[2]!=raw_a[a]: raise SystemExit('A bytes changed '+a)
              if sec(candidate,p)[2]!=raw_p[p]: raise SystemExit('Parent bytes changed '+p)
          if candidate.count('class="cw-section-accordion"')!=23: raise SystemExit('accordion count changed')

          helper='''<script>\nsetTimeout(async()=>{\n const pairs=[['people','people-authority-boundary'],['system','evidence-to-implementation'],['what-we-need-now','river-economy-overview'],['alliance-architecture','people-guardians-stewardship']];\n const sleep=ms=>new Promise(r=>setTimeout(r,ms));let ok=!document.getElementById('context'),diag=[];\n for(const [pid,aid] of pairs){\n  const p=document.getElementById(pid),a=document.getElementById(aid),box=p?.closest('.cw-section-accordion'),btn=box?.querySelector(':scope>.cw-accordion-trigger');\n  if(!p||!a||!box||!btn){ok=false;diag.push(aid+':missing');continue;}\n  const start=a.hidden===true,after=Boolean(box.compareDocumentPosition(a)&Node.DOCUMENT_POSITION_FOLLOWING);\n  btn.click();await sleep(360);\n  const open=btn.getAttribute('aria-expanded')==='true'&&!a.hidden;\n  const al=a.querySelector('.container')?.getBoundingClientRect().left,rl=btn.querySelector('.container')?.getBoundingClientRect().left;\n  const aligned=Number.isFinite(al)&&Number.isFinite(rl)&&Math.abs(al-rl)<=1.5;\n  const controls=(btn.getAttribute('aria-controls')||'').split(/\\s+/).includes(aid);\n  btn.click();await sleep(360);const close=btn.getAttribute('aria-expanded')==='false'&&a.hidden===true;\n  const pass=start&&after&&open&&aligned&&controls&&close;ok=ok&&pass;diag.push(aid+':'+[start,after,open,aligned,controls,close,Math.round(al),Math.round(rl)].join(','));\n }\n document.body.dataset.nestingTest=ok?'pass':'fail';document.body.dataset.nestingDiagnostics=diag.join('|');\n},180);\n</script>'''
          Path('/tmp/cw-nesting-test.html').write_text(candidate.replace('</body>',helper+'</body>',1),encoding='utf-8')
          enc=base64.b64encode(gzip.compress(candidate.encode(),compresslevel=9,mtime=0)).decode('ascii'); size=(len(enc)+16)//17
          chunks=[enc[i*size:(i+1)*size] for i in range(16)]+[enc[16*size:]]
          if len(chunks)!=17 or any(not c for c in chunks): raise SystemExit('chunking failure')
          for i,c in enumerate(chunks):(d/f'hub-{i:02d}.txt').write_text(c,encoding='ascii')
          rb=''.join((d/f'hub-{i:02d}.txt').read_text(encoding='ascii') for i in range(17));rb+='='*(-len(rb)%4)
          if gzip.decompress(base64.b64decode(rb)).decode()!=candidate: raise SystemExit('roundtrip failure')
          print('BASELINE_SHA256='+baseline_sha)
          print('CONTEXT_NOTE_REMOVED=PASS')
          print('A_SECTION_BYTES_PRESERVED=PASS')
          print('PARENT_SECTION_BYTES_PRESERVED=PASS')
          print('UNTOUCHED_BYTES_PRESERVED=PASS')
          print('CANDIDATE_SHA256='+hashlib.sha256(candidate.encode()).hexdigest())
          PY
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "file:///tmp/cw-nesting-test.html" > /tmp/cw-nesting-rendered.html
          grep -o '<body[^>]*>' /tmp/cw-nesting-rendered.html | head -1 || true
          grep -q 'data-nesting-test="pass"' /tmp/cw-nesting-rendered.html
          echo 'BROWSER_NESTING_03A_07A_10A_14A=PASS'
          echo 'BROWSER_PARENT_OPEN_CLOSE=PASS'
          echo 'BROWSER_NUMBERED_TITLE_ALIGNMENT=PASS'
          echo 'BROWSER_CONTEXT_NOTE_ABSENT=PASS'
      - name: Commit only hub payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/payload/hub-*.txt
          git commit -m 'Nest A-sections under parent accordions and remove context note'
          git push origin HEAD:fix/hub-accordion-nesting-20260829
