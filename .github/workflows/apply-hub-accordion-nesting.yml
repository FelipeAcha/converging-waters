name: Apply hub accordion nesting
on:
  push:
    branches:
      - fix/hub-accordion-nesting-20260829
    paths:
      - .github/workflows/apply-hub-accordion-nesting.yml
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/hub-accordion-nesting-20260829
      - name: Build and validate nesting-only candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re

          payload_dir=Path('docs/payload')
          parts=[payload_dir/f'hub-{i:02d}.txt' for i in range(17)]
          if not all(p.exists() for p in parts):
              raise SystemExit('Missing hub payload chunk')
          b64=re.sub(r'\s+','',''.join(p.read_text(encoding='ascii') for p in parts)); b64+='='*(-len(b64)%4)
          baseline=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          baseline_sha=hashlib.sha256(baseline.encode()).hexdigest()
          expected_sha='34424f9a914dc45d9ea387d094aca5d17f4a846e15131ea751ccbc1266f03afa'
          if baseline_sha!=expected_sha:
              raise SystemExit('Baseline drift: '+baseline_sha)

          def section_span(src, section_id):
              open_re=re.compile(r'<section\b[^>]*\bid=["\']'+re.escape(section_id)+r'["\'][^>]*>',re.I)
              m=open_re.search(src)
              if not m: raise RuntimeError('section not found: '+section_id)
              token=re.compile(r'</?section\b[^>]*>',re.I)
              depth=0
              for t in token.finditer(src,m.start()):
                  if t.group(0).lower().startswith('</'):
                      depth-=1
                      if depth==0:
                          return m.start(),t.end(),src[m.start():t.end()]
                  else:
                      depth+=1
              raise RuntimeError('unclosed section: '+section_id)

          context_id='context'
          addons={
              'people-authority-boundary':('people','03'),
              'evidence-to-implementation':('system','07'),
              'river-economy-overview':('what-we-need-now','10'),
              'people-guardians-stewardship':('alliance-architecture','14'),
          }

          # Preconditions: exact requested blocks exist once; A-sections are currently outside their parent accordion.
          if baseline.count('id="context"')!=1:
              raise SystemExit('Context block count changed')
          for aid,(pid,num) in addons.items():
              if baseline.count(f'id="{aid}"')!=1 or baseline.count(f'id="{pid}"')!=1:
                  raise SystemExit(f'ID count changed for {aid}/{pid}')
              _,_,araw=section_span(baseline,aid)
              _,_,praw=section_span(baseline,pid)
              if araw in praw:
                  raise SystemExit(f'{aid} already nested in {pid}')

          # Preserve exact raw sections before any movement/removal.
          _,_,context_raw=section_span(baseline,context_id)
          addon_raw={aid:section_span(baseline,aid)[2] for aid in addons}
          parent_raw={pid:section_span(baseline,pid)[2] for pid,_ in addons.values()}

          candidate=baseline
          # Authorized deletion only: remove the exact Context note section.
          if candidate.count(context_raw)!=1:
              raise SystemExit('Context raw section is not unique')
          candidate=candidate.replace(context_raw,'',1)

          # Authorized ordering correction only: move 03A to immediately after the 03 accordion wrapper.
          # Other A-sections already sit immediately after their parent accordion in the source order.
          a03=addon_raw['people-authority-boundary']
          candidate=candidate.replace(a03,'',1)
          # Locate the complete accordion wrapper that contains section #people.
          p03_start=candidate.index(parent_raw['people'])
          div_token=re.compile(r'</?div\b[^>]*>',re.I)
          opens=[]
          for m in div_token.finditer(candidate,0,p03_start):
              if m.group(0).lower().startswith('</'):
                  if opens: opens.pop()
              else:
                  opens.append((m.start(),m.group(0)))
          wrapper_start=None
          for pos,tag in reversed(opens):
              if 'cw-section-accordion' in tag:
                  wrapper_start=pos; break
          if wrapper_start is None:
              raise SystemExit('03 accordion wrapper not found')
          depth=0; wrapper_end=None
          for m in div_token.finditer(candidate,wrapper_start):
              if m.group(0).lower().startswith('</'):
                  depth-=1
                  if depth==0:
                      wrapper_end=m.end(); break
              else:
                  depth+=1
          if wrapper_end is None:
              raise SystemExit('03 accordion wrapper unclosed')
          candidate=candidate[:wrapper_end]+a03+candidate[wrapper_end:]

          # Extend the existing accordion JS only to control the four A-sections as linked subsections.
          old="""  const all=[...document.querySelectorAll('.cw-section-accordion')];\n  if(all.length!==23){console.error('Accordion contract failed.');return;}\n  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  all.forEach(box=>{\n    const button=box.querySelector(':scope>.cw-accordion-trigger');\n    const panel=box.querySelector(':scope>.cw-accordion-panel');\n    const source=[...panel.querySelectorAll('.kicker')].find(el=>/^\\s*\\d{2}\\s*[·•-]/.test(el.textContent||''));\n    if(!button||!panel||!source){console.error('Accordion source missing',box.dataset.cwSection);return;}\n    source.classList.add('cw-accordion-source-label'); source.hidden=true;\n    const finishOpen=()=>{panel.style.height='';panel.style.opacity='';panel.style.transition='';delete box.dataset.animating;};\n    const finishClose=()=>{panel.hidden=true;panel.style.height='';panel.style.opacity='';panel.style.transition='';delete box.dataset.animating;};\n    button.addEventListener('click',()=>{\n"""
          new="""  const all=[...document.querySelectorAll('.cw-section-accordion')];\n  if(all.length!==23){console.error('Accordion contract failed.');return;}\n  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n  const addonByParentId={people:'people-authority-boundary',system:'evidence-to-implementation','what-we-need-now':'river-economy-overview','alliance-architecture':'people-guardians-stewardship'};\n  all.forEach(box=>{\n    const button=box.querySelector(':scope>.cw-accordion-trigger');\n    const panel=box.querySelector(':scope>.cw-accordion-panel');\n    const source=[...panel.querySelectorAll('.kicker')].find(el=>/^\\s*\\d{2}\\s*[·•-]/.test(el.textContent||''));\n    if(!button||!panel||!source){console.error('Accordion source missing',box.dataset.cwSection);return;}\n    source.classList.add('cw-accordion-source-label'); source.hidden=true;\n    const parentSection=panel.querySelector(':scope>section');\n    const addonId=parentSection&&addonByParentId[parentSection.id];\n    const addon=addonId&&document.getElementById(addonId);\n    if(addon){addon.hidden=true;button.setAttribute('aria-controls',button.getAttribute('aria-controls')+' '+addon.id);}\n    const finishOpen=()=>{panel.style.height='';panel.style.opacity='';panel.style.transition='';delete box.dataset.animating;};\n    const finishClose=()=>{panel.hidden=true;if(addon)addon.hidden=true;panel.style.height='';panel.style.opacity='';panel.style.transition='';delete box.dataset.animating;};\n    button.addEventListener('click',()=>{\n"""
          if candidate.count(old)!=1:
              raise SystemExit('Accordion JS anchor changed')
          candidate=candidate.replace(old,new,1)

          old_reduce="""      if(reduced){\n        button.setAttribute('aria-expanded',String(opening));box.classList.toggle('is-open',opening);panel.hidden=!opening;return;\n      }\n"""
          new_reduce="""      if(reduced){\n        button.setAttribute('aria-expanded',String(opening));box.classList.toggle('is-open',opening);panel.hidden=!opening;if(addon)addon.hidden=!opening;return;\n      }\n"""
          if candidate.count(old_reduce)!=1:
              raise SystemExit('Reduced-motion anchor changed')
          candidate=candidate.replace(old_reduce,new_reduce,1)

          old_open="""      if(opening){\n        panel.hidden=false;button.setAttribute('aria-expanded','true');box.classList.add('is-open');\n"""
          new_open="""      if(opening){\n        panel.hidden=false;if(addon)addon.hidden=false;button.setAttribute('aria-expanded','true');box.classList.add('is-open');\n"""
          if candidate.count(old_open)!=1:
              raise SystemExit('Open anchor changed')
          candidate=candidate.replace(old_open,new_open,1)

          # Strict preservation: after removing only the four A-sections and the context section,
          # every remaining byte must match the prior baseline.
          def strip_authorized(src):
              out=src
              for sid in [context_id,*addons.keys()]:
                  try:
                      _,_,raw=section_span(out,sid)
                  except RuntimeError:
                      continue
                  out=out.replace(raw,'',1)
              # Normalize only the tiny authorized JS extension back to its baseline form.
              out=out.replace(new,old,1).replace(new_reduce,old_reduce,1).replace(new_open,old_open,1)
              return out
          if strip_authorized(candidate)!=strip_authorized(baseline):
              raise SystemExit('Preservation failure outside authorized context/A-section/accordion-nesting changes')

          if 'id="context"' in candidate or 'This is a new moment' in candidate:
              raise SystemExit('Context note still present')
          for aid,(pid,num) in addons.items():
              if candidate.count(f'id="{aid}"')!=1:
                  raise SystemExit('A-section missing/duplicated: '+aid)
              if section_span(candidate,aid)[2]!=addon_raw[aid]:
                  raise SystemExit('A-section bytes changed: '+aid)
              if section_span(candidate,pid)[2]!=parent_raw[pid]:
                  raise SystemExit('Parent section bytes changed: '+pid)
          if candidate.count('class="cw-section-accordion"')!=23:
              raise SystemExit('Accordion count changed')

          # Browser test: all four A-sections start hidden, open with their parent, close with it,
          # appear after their parent accordion, and align to the same content left edge.
          helper='''<script>\nsetTimeout(async()=>{\n  const pairs=[['people','people-authority-boundary','03'],['system','evidence-to-implementation','07'],['what-we-need-now','river-economy-overview','10'],['alliance-architecture','people-guardians-stewardship','14']];\n  let ok=!document.getElementById('context'); const diagnostics=[];\n  const sleep=ms=>new Promise(r=>setTimeout(r,ms));\n  for(const [pid,aid,num] of pairs){\n    const p=document.getElementById(pid), a=document.getElementById(aid), box=p?.closest('.cw-section-accordion'), btn=box?.querySelector(':scope>.cw-accordion-trigger');\n    if(!p||!a||!box||!btn){ok=false;diagnostics.push(aid+':missing');continue;}\n    const startsHidden=a.hidden===true;\n    const afterParent=box.compareDocumentPosition(a)&Node.DOCUMENT_POSITION_FOLLOWING;\n    btn.click(); await sleep(360);\n    const opened=btn.getAttribute('aria-expanded')==='true'&&!a.hidden;\n    const aLeft=a.querySelector('.container')?.getBoundingClientRect().left;\n    const rowLeft=btn.querySelector('.container')?.getBoundingClientRect().left;\n    const pLeft=p.querySelector('.container')?.getBoundingClientRect().left;\n    const aligned=[aLeft,rowLeft,pLeft].every(Number.isFinite)&&Math.max(aLeft,rowLeft,pLeft)-Math.min(aLeft,rowLeft,pLeft)<=1.5;\n    const controls=(btn.getAttribute('aria-controls')||'').split(/\\s+/).includes(aid);\n    btn.click(); await sleep(360);\n    const closed=btn.getAttribute('aria-expanded')==='false'&&a.hidden===true;\n    const pass=startsHidden&&Boolean(afterParent)&&opened&&aligned&&controls&&closed;\n    ok=ok&&pass; diagnostics.push(aid+':'+[startsHidden,Boolean(afterParent),opened,aligned,controls,closed].join(','));\n  }\n  document.body.dataset.nestingTest=ok?'pass':'fail';\n  document.body.dataset.nestingDiagnostics=diagnostics.join('|');\n},180);\n</script>'''
          Path('/tmp/cw-nesting-test.html').write_text(candidate.replace('</body>',helper+'</body>',1),encoding='utf-8')

          encoded=base64.b64encode(gzip.compress(candidate.encode(),compresslevel=9,mtime=0)).decode('ascii')
          size=(len(encoded)+16)//17
          chunks=[encoded[i*size:(i+1)*size] for i in range(16)]+[encoded[16*size:]]
          if len(chunks)!=17 or any(not c for c in chunks): raise SystemExit('chunking failure')
          for i,c in enumerate(chunks): (payload_dir/f'hub-{i:02d}.txt').write_text(c,encoding='ascii')
          rb=''.join((payload_dir/f'hub-{i:02d}.txt').read_text(encoding='ascii') for i in range(17)); rb+='='*(-len(rb)%4)
          if gzip.decompress(base64.b64decode(rb)).decode()!=candidate: raise SystemExit('payload roundtrip failure')

          print('BASELINE_SHA256='+baseline_sha)
          print('CONTEXT_NOTE_REMOVED=1')
          print('A_SECTIONS_LINKED_TO_PARENT=03A,07A,10A,14A')
          print('A_SECTION_BYTES_PRESERVED=PASS')
          print('PARENT_SECTION_BYTES_PRESERVED=PASS')
          print('UNTOUCHED_BYTES_PRESERVED=PASS')
          print('CANDIDATE_SHA256='+hashlib.sha256(candidate.encode()).hexdigest())
          PY

          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=6000 --dump-dom "file:///tmp/cw-nesting-test.html" > /tmp/cw-nesting-rendered.html
          grep -o '<body[^>]*>' /tmp/cw-nesting-rendered.html | head -1 || true
          grep -q 'data-nesting-test="pass"' /tmp/cw-nesting-rendered.html
          echo 'BROWSER_NESTING_03A_07A_10A_14A=PASS'
          echo 'BROWSER_PARENT_OPEN_CLOSE=PASS'
          echo 'BROWSER_INDENT_ALIGNMENT=PASS'
          echo 'BROWSER_CONTEXT_NOTE_ABSENT=PASS'
      - name: Commit only hub payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/payload/hub-*.txt
          git commit -m 'Nest A-sections under parent accordions and remove context note'
          git push origin HEAD:fix/hub-accordion-nesting-20260829
