name: ACB alliance web watchdog

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/acb/**'
      - '.github/workflows/acb-alliance-web-watchdog.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/acb/**'
      - '.github/workflows/acb-alliance-web-watchdog.yml'
  workflow_dispatch:
  schedule:
    # Primary enforcement is event-driven. This is a frequent recovery heartbeat,
    # intentionally offset from the top of the hour.
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: acb-alliance-web-${{ github.ref }}
  cancel-in-progress: true

env:
  ACB_OUTPUT_DIR: acb-evidence

jobs:
  browser-qa:
    name: Browser QA · ${{ matrix.surface }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          # Historical / working surfaces remain monitored. The dynamic active-review
          # job below is the only blocking review-candidate gate.
          - surface: published-working
            url: https://felipeacha.github.io/converging-waters/
            blocking: false
            source_path: ''
          - surface: immutable-review-v13
            url: https://felipeacha.github.io/converging-waters/releases/v13/
            blocking: false
            source_path: ''
          - surface: historical-candidate-v17.0-rev02
            url: https://felipeacha.github.io/converging-waters/candidates/v17.0-rev02/
            blocking: false
            source_path: docs/candidates/v17.0-rev02/index.html
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser audit dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Resolve system Chromium
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          echo "bin=$chrome" >> "$GITHUB_OUTPUT"
          "$chrome" --version

      - name: Run ACB browser audit
        id: audit
        continue-on-error: true
        env:
          ACB_TARGET_URL: ${{ matrix.url }}
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: node .github/acb/acb_web_guard.mjs

      - name: Attach immutable run metadata
        if: always()
        env:
          SURFACE: ${{ matrix.surface }}
          TARGET_URL: ${{ matrix.url }}
          BLOCKING: ${{ matrix.blocking }}
          SOURCE_PATH: ${{ matrix.source_path }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out = Path(os.environ.get('ACB_OUTPUT_DIR', 'acb-evidence'))
          out.mkdir(parents=True, exist_ok=True)
          files = {}
          for p in sorted(out.glob('*')):
              if p.is_file():
                  files[p.name] = hashlib.sha256(p.read_bytes()).hexdigest()
          source_path = os.environ.get('SOURCE_PATH') or None
          source_sha256 = None
          source_size_bytes = None
          if source_path:
              source = Path(source_path)
              if not source.is_file():
                  raise SystemExit(f'Configured source path not found: {source_path}')
              raw = source.read_bytes()
              source_sha256 = hashlib.sha256(raw).hexdigest()
              source_size_bytes = len(raw)
          meta = {
              'surface': os.environ['SURFACE'],
              'target_url': os.environ['TARGET_URL'],
              'blocking': os.environ.get('BLOCKING') == 'true',
              'source_path': source_path,
              'source_sha256': source_sha256,
              'source_size_bytes': source_size_bytes,
              'repository': os.environ.get('GITHUB_REPOSITORY'),
              'commit_sha': os.environ.get('GITHUB_SHA'),
              'ref': os.environ.get('GITHUB_REF'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'run_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
              'event_name': os.environ.get('GITHUB_EVENT_NAME'),
              'audit_outcome': os.environ.get('AUDIT_OUTCOME'),
              'artifact_file_sha256': files,
          }
          (out / 'run-metadata.json').write_text(json.dumps(meta, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload screenshots, DOM and checklist evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acb-${{ matrix.surface }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: acb-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Report historical monitor failure without promoting it
        if: always() && steps.audit.outcome != 'success'
        run: echo 'MONITOR_ONLY_FAIL ${{ matrix.surface }}; dynamic active review candidate gate is unchanged.'

  active-review-candidate:
    name: Browser QA · dynamic active review candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser audit dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24

      - name: Resolve system Chromium
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          echo "bin=$chrome" >> "$GITHUB_OUTPUT"
          "$chrome" --version

      - name: Resolve active candidate contract from cumulative state
        id: active
        shell: bash
        run: |
          set -euo pipefail
          state=docs/candidates/progress/.cumulative-progress-state.txt
          test -f "$state"
          route=$(grep '^REVIEW_ROUTE=' "$state" | cut -d= -f2-)
          sha=$(grep '^SOURCE_HUB_SHA256=' "$state" | cut -d= -f2-)
          revision=$(grep '^REVISION_NAME=' "$state" | cut -d= -f2-)
          test -n "$route"
          test -n "$sha"
          url="https://felipeacha.github.io/converging-waters/${route}"
          echo "route=$route" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "ACTIVE_REVIEW_URL=$url"

      - name: Run active-candidate contract unit regression
        run: node .github/acb/test_active_review_candidate_contract.mjs

      - name: Wait for exact active review route deployment
        shell: bash
        env:
          ACTIVE_URL: ${{ steps.active.outputs.url }}
          EXPECTED_SHA: ${{ steps.active.outputs.sha }}
        run: |
          set -euo pipefail
          code=000
          for attempt in $(seq 1 72); do
            code=$(curl -L --silent --show-error --output /tmp/active-review.html --write-out '%{http_code}' "$ACTIVE_URL" || true)
            if [ "$code" = 200 ] && grep -Fq "$EXPECTED_SHA" /tmp/active-review.html; then
              echo "PASS exact active review route deployed: $ACTIVE_URL"
              exit 0
            fi
            sleep 5
          done
          echo "Active review route did not expose expected candidate identity after polling: HTTP $code $ACTIVE_URL" >&2
          exit 1

      - name: Run exact active-review browser contract
        id: active_audit
        env:
          ACB_ACTIVE_TARGET_URL: ${{ steps.active.outputs.url }}
          ACB_STATE_PATH: docs/candidates/progress/.cumulative-progress-state.txt
          ACB_OUTPUT_DIR: acb-active-evidence
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: node .github/acb/active_review_candidate_qa.mjs

      - name: Upload active-review screenshots and contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acb-active-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: acb-active-evidence/
          if-no-files-found: error
          retention-days: 30

  watchdog-summary:
    name: ACB active-candidate enforcement
    if: always()
    needs: [browser-qa, active-review-candidate]
    runs-on: ubuntu-latest
    steps:
      - name: Require dynamic active-candidate completion
        run: |
          echo 'historical browser-qa result: ${{ needs.browser-qa.result }}'
          echo 'active-review-candidate result: ${{ needs.active-review-candidate.result }}'
          test '${{ needs.browser-qa.result }}' = success
          test '${{ needs.active-review-candidate.result }}' = success
