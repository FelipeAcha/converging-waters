name: ACB alliance web watchdog

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/acb/**'
      - '.github/workflows/acb-alliance-web-watchdog.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/acb/**'
      - '.github/workflows/acb-alliance-web-watchdog.yml'
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'

permissions:
  contents: read

concurrency:
  group: acb-alliance-web-${{ github.ref }}
  cancel-in-progress: true

env:
  ACB_OUTPUT_DIR: acb-evidence

jobs:
  published-freeze-contract:
    name: Published freeze contract
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Enforce frozen published components
        run: |
          python3 .github/acb/validate_published_freeze.py \
            --config .github/acb/cw_published_freeze_contract.json \
            --json-out acb-evidence/published-freeze.json
      - name: Upload freeze evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acb-published-freeze-${{ github.run_id }}-${{ github.run_attempt }}
          path: acb-evidence/published-freeze.json
          if-no-files-found: error
          retention-days: 30

  browser-qa:
    name: Browser QA · ${{ matrix.surface }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: published-working
            url: https://felipeacha.github.io/converging-waters/
            blocking: true
            source_path: ''
          - surface: immutable-review-v13
            url: https://felipeacha.github.io/converging-waters/releases/v13/
            blocking: false
            source_path: ''
          - surface: rejected-candidate-v17.0-rev02
            url: https://felipeacha.github.io/converging-waters/candidates/v17.0-rev02/
            blocking: false
            source_path: docs/candidates/v17.0-rev02/index.html
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser audit dependency
        run: npm install --no-save --ignore-scripts puppeteer-core@24
      - name: Resolve system Chromium
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          echo "bin=$chrome" >> "$GITHUB_OUTPUT"
          "$chrome" --version
      - name: Run ACB browser audit
        id: audit
        continue-on-error: true
        env:
          ACB_TARGET_URL: ${{ matrix.url }}
          CHROME_BIN: ${{ steps.chrome.outputs.bin }}
        run: node .github/acb/acb_web_guard.mjs
      - name: Attach immutable run metadata
        if: always()
        env:
          SURFACE: ${{ matrix.surface }}
          TARGET_URL: ${{ matrix.url }}
          BLOCKING: ${{ matrix.blocking }}
          SOURCE_PATH: ${{ matrix.source_path }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          out=Path(os.environ.get('ACB_OUTPUT_DIR','acb-evidence')); out.mkdir(parents=True,exist_ok=True)
          files={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(out.glob('*')) if p.is_file()}
          source_path=os.environ.get('SOURCE_PATH') or None; source_sha256=None; source_size_bytes=None
          if source_path:
              source=Path(source_path)
              if not source.is_file(): raise SystemExit(f'Configured source path not found: {source_path}')
              raw=source.read_bytes(); source_sha256=hashlib.sha256(raw).hexdigest(); source_size_bytes=len(raw)
          meta={'surface':os.environ['SURFACE'],'target_url':os.environ['TARGET_URL'],'blocking':os.environ.get('BLOCKING')=='true','source_path':source_path,'source_sha256':source_sha256,'source_size_bytes':source_size_bytes,'repository':os.environ.get('GITHUB_REPOSITORY'),'commit_sha':os.environ.get('GITHUB_SHA'),'ref':os.environ.get('GITHUB_REF'),'run_id':os.environ.get('GITHUB_RUN_ID'),'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'event_name':os.environ.get('GITHUB_EVENT_NAME'),'audit_outcome':os.environ.get('AUDIT_OUTCOME'),'artifact_file_sha256':files}
          (out/'run-metadata.json').write_text(json.dumps(meta,indent=2)+'\n',encoding='utf-8'); print(json.dumps(meta,indent=2))
          PY
      - name: Upload screenshots, DOM and checklist evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acb-${{ matrix.surface }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: acb-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Require blocking surface ACB hard gates
        if: always() && matrix.blocking
        run: test '${{ steps.audit.outcome }}' = success
      - name: Report monitor-only failure
        if: always() && !matrix.blocking && steps.audit.outcome != 'success'
        run: echo 'MONITOR_ONLY_FAIL ${{ matrix.surface }}'

  watchdog-summary:
    name: ACB published-site enforcement
    if: always()
    needs: [published-freeze-contract, browser-qa]
    runs-on: ubuntu-latest
    steps:
      - name: Require published freeze and browser completion
        run: |
          echo 'published-freeze-contract result: ${{ needs.published-freeze-contract.result }}'
          echo 'browser-qa result: ${{ needs.browser-qa.result }}'
          test '${{ needs.published-freeze-contract.result }}' = success
          test '${{ needs.browser-qa.result }}' = success
