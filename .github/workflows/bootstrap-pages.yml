name: Bootstrap and deploy Converging Waters preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      source_sha256: ${{ steps.report.outputs.source_sha256 }}
    steps:
      - name: Checkout independent repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import existing public working site into immutable release and preview
        run: |
          set -euo pipefail
          rm -rf /tmp/converging-waters-source
          git clone --depth 1 --branch converging-waters-public-site \
            https://github.com/FelipeAcha/uno.git /tmp/converging-waters-source

          mkdir -p docs/releases/bootstrap-source docs/preview
          rm -rf docs/releases/bootstrap-source/* docs/preview/*
          cp -R /tmp/converging-waters-source/. docs/releases/bootstrap-source/
          cp -R /tmp/converging-waters-source/. docs/preview/
          rm -rf docs/releases/bootstrap-source/.git docs/preview/.git
          touch docs/.nojekyll

          cat > docs/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Converging Waters — Review Gateway</title>
            <meta name="robots" content="noindex,nofollow">
            <style>
              body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5efe6;color:#123c2d;font:17px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
              main{max-width:760px;margin:24px;padding:42px;border:1px solid #d8c5a2;border-radius:24px;background:#fffdf8;box-shadow:0 18px 55px rgba(20,61,46,.12)}
              h1{font:700 44px/1.05 Georgia,serif;margin:0 0 14px}.button{display:inline-block;margin-top:18px;padding:13px 20px;border-radius:999px;background:#174d39;color:white;text-decoration:none;font-weight:700}
              code{background:#eee7da;padding:.15em .35em;border-radius:.35em}
            </style>
          </head>
          <body><main>
            <p><strong>Independent personal project</strong></p>
            <h1>Converging Waters</h1>
            <p>The current site is available as a review preview. Production promotion remains pending explicit approval.</p>
            <a class="button" href="./preview/">Open review preview</a>
            <p><small>This repository and deployment are separate from Norte Solar.</small></p>
          </main></body></html>
          HTML

      - id: report
        name: Verify imported self-contained source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json, re
          root = Path('docs/preview')
          loader = (root / 'index.html').read_text(encoding='utf-8')
          names = re.findall(r'"(chunks/[^"]+\.txt)"', loader)
          report = {
              'imported_loader': bool(names),
              'chunk_count': len(names),
              'source_repository': 'FelipeAcha/uno',
              'source_branch': 'converging-waters-public-site',
          }
          if names:
              payload = ''.join((root / n).read_text(encoding='utf-8') for n in names).strip()
              html = gzip.decompress(base64.b64decode(payload))
              report.update({
                  'decompressed_bytes': len(html),
                  'decompressed_sha256': hashlib.sha256(html).hexdigest(),
                  'contains_purpose_led_measurement': b'PURPOSE-LED MEASUREMENT' in html,
                  'contains_legal_readiness': b'Legal Readiness' in html,
                  'contains_pavel_marmanillo': b'Pavel Marmanillo' in html,
                  'contains_bartolome_de_las_casas': b'Bartolom' in html and b'Casas' in html,
              })
          Path('docs/bootstrap-report.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2))
          with open(Path.cwd() / 'source_sha.txt', 'w', encoding='utf-8') as f:
              f.write(report.get('decompressed_sha256', 'unavailable'))
          PY
          echo "source_sha256=$(cat source_sha.txt)" >> "$GITHUB_OUTPUT"

      - name: Commit imported preview and verification report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "Bootstrap independent preview from prior personal publication"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
