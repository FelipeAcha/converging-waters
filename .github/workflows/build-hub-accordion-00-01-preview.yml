name: Build hub accordion 00-01 preview

on:
  push:
    branches:
      - review/hub-accordion-00-01-20260829
    paths:
      - .github/workflows/build-hub-accordion-00-01-preview.yml

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: review/hub-accordion-00-01-20260829

      - name: Build and verify isolated 00-01 accordion preview
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, html as htmlmod, re

          payloads = sorted(Path('docs/payload').glob('hub-*.txt'))
          if len(payloads) != 17:
              raise SystemExit(f'expected 17 hub payload chunks, found {len(payloads)}')

          b64 = re.sub(r'\s+', '', ''.join(p.read_text(encoding='ascii') for p in payloads))
          b64 += '=' * (-len(b64) % 4)
          baseline = gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          baseline_sha = hashlib.sha256(baseline.encode()).hexdigest()

          if 'cw-section-accordion-preview-styles' in baseline or 'cw-section-accordion' in baseline:
              raise SystemExit('baseline already contains accordion preview markers')

          def section_spans(src):
              token = re.compile(r'</?section\b[^>]*>', re.I)
              stack = []
              spans = []
              for m in token.finditer(src):
                  if m.group(0).lower().startswith('</'):
                      if not stack:
                          raise RuntimeError('unbalanced closing section')
                      start = stack.pop()
                      spans.append((start, m.end(), src[start:m.end()]))
                  else:
                      stack.append(m.start())
              if stack:
                  raise RuntimeError('unclosed section tag')
              return sorted(spans, key=lambda x: x[0])

          def plain_text(raw):
              t = re.sub(r'<script\b[^>]*>.*?</script>', ' ', raw, flags=re.I|re.S)
              t = re.sub(r'<style\b[^>]*>.*?</style>', ' ', t, flags=re.I|re.S)
              t = re.sub(r'<[^>]+>', ' ', t)
              return ' '.join(htmlmod.unescape(t).split())

          spans = section_spans(baseline)
          def find_title(title):
              hits = [(a,b,raw) for a,b,raw in spans if title.lower() in plain_text(raw).lower()]
              if len(hits) != 1:
                  raise RuntimeError(f'expected one section containing {title!r}, found {len(hits)}')
              return hits[0]

          s00 = find_title('What has changed')
          s01 = find_title('Where we are now')
          if s00[0] >= s01[0]:
              raise RuntimeError('00/01 section order is unexpected')

          raw00, raw01 = s00[2], s01[2]
          sha00 = hashlib.sha256(raw00.encode()).hexdigest()
          sha01 = hashlib.sha256(raw01.encode()).hexdigest()

          style = '''<style id="cw-section-accordion-preview-styles">
          .cw-section-accordion{margin:0;border:0;border-top:1px solid rgba(19,55,47,.12);background:transparent}
          .cw-section-accordion:last-of-type{border-bottom:1px solid rgba(19,55,47,.12)}
          .cw-section-accordion>summary{list-style:none;cursor:pointer;user-select:none;padding:0;background:rgba(255,253,248,.48);transition:background .18s ease}
          .cw-section-accordion>summary::-webkit-details-marker{display:none}
          .cw-section-accordion>summary:hover{background:rgba(255,253,248,.82)}
          .cw-section-accordion>summary:focus-visible{outline:3px solid #c8952f;outline-offset:-3px}
          .cw-accordion-summary-inner{min-height:92px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding-top:18px;padding-bottom:18px}
          .cw-accordion-number{font-size:.82rem;font-weight:950;letter-spacing:.16em;color:#c8952f}
          .cw-accordion-title{font-size:clamp(1.7rem,3.2vw,2.65rem);line-height:1;letter-spacing:-.045em;font-weight:900;color:#10261d}
          .cw-accordion-toggle{width:36px;height:36px;border:1px solid rgba(19,55,47,.15);border-radius:999px;display:grid;place-items:center;font-size:1.35rem;font-weight:700;line-height:1;color:#174d39;background:#fffdf8}
          .cw-section-accordion[open] .cw-accordion-toggle{transform:rotate(45deg)}
          .cw-section-accordion[open]>summary{background:rgba(255,253,248,.72)}
          .cw-accordion-panel{display:block}
          @media(max-width:700px){.cw-accordion-summary-inner{min-height:76px;grid-template-columns:auto 1fr auto;gap:12px}.cw-accordion-toggle{width:32px;height:32px}.cw-accordion-title{font-size:1.55rem}}
          </style>'''

          def wrapper(num, title, raw):
              return (f'<details class="cw-section-accordion" data-cw-section="{num}">'
                      f'<summary><span class="cw-accordion-summary-inner container">'
                      f'<span class="cw-accordion-number">{num}</span>'
                      f'<span class="cw-accordion-title">{title}</span>'
                      f'<span class="cw-accordion-toggle" aria-hidden="true">+</span>'
                      f'</span></summary><div class="cw-accordion-panel">{raw}</div></details>')

          wrap00 = wrapper('00', 'What has changed', raw00)
          wrap01 = wrapper('01', 'Where we are now', raw01)

          # Build from the frozen baseline: insert one scoped style and wrap only 00 + 01.
          candidate = baseline[:s00[0]] + style + wrap00 + baseline[s00[1]:s01[0]] + wrap01 + baseline[s01[1]:]

          # Strong preservation gate: every original <section> remains byte-identical and in the same order.
          before_sections = [raw for _,_,raw in section_spans(baseline)]
          after_sections = [raw for _,_,raw in section_spans(candidate)]
          if before_sections != after_sections:
              raise RuntimeError('one or more original section blocks changed')

          # Exact reversibility gate: removing only the new style/wrappers reconstructs baseline byte-for-byte.
          restored = candidate.replace(style, '', 1).replace(wrap00, raw00, 1).replace(wrap01, raw01, 1)
          if restored != baseline:
              raise RuntimeError('candidate cannot be reversed to baseline byte-for-byte')

          if candidate.count('<details class="cw-section-accordion"') != 2:
              raise RuntimeError('expected exactly two accordion wrappers')
          if 'data-cw-section="00" open' in candidate or 'data-cw-section="01" open' in candidate:
              raise RuntimeError('accordions must be closed by default')
          if '<span class="cw-accordion-title">What has changed</span>' not in candidate:
              raise RuntimeError('00 summary title missing')
          if '<span class="cw-accordion-title">Where we are now</span>' not in candidate:
              raise RuntimeError('01 summary title missing')
          summary_region = candidate[candidate.index('<details class="cw-section-accordion"'):candidate.index(raw00)]
          if re.search(r'V\s*0\.1', summary_region, re.I):
              raise RuntimeError('V 0.1 leaked into the visible 00 summary')
          if hashlib.sha256(raw00.encode()).hexdigest() != sha00 or hashlib.sha256(raw01.encode()).hexdigest() != sha01:
              raise RuntimeError('target section hash changed unexpectedly')

          out = Path('docs/review-hub-accordion-00-01.html')
          out.write_text(candidate, encoding='utf-8')
          readback = out.read_text(encoding='utf-8')
          if readback != candidate:
              raise RuntimeError('preview file readback mismatch')

          print('PREVIEW_BUILD_PASS')
          print('baseline_sha256=' + baseline_sha)
          print('section00_sha256=' + sha00)
          print('section01_sha256=' + sha01)
          print('all_original_sections=BYTE_EXACT')
          print('accordions=2_CLOSED_BY_DEFAULT')
          print('preview_sha256=' + hashlib.sha256(candidate.encode()).hexdigest())
          PY

      - name: Commit isolated preview only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/review-hub-accordion-00-01.html
          git commit -m 'Add isolated hub accordion preview for 00 and 01'
          git push origin HEAD:review/hub-accordion-00-01-20260829
