name: Restore REV30 section 14 visual system

on:
  push:
    branches:
      - fix/section14-rev30-styles-20260829
    paths:
      - docs-governance/recovery/section14-rev30-full-00.b64
      - docs-governance/recovery/section14-rev30-tail-*.b64
      - .github/workflows/section14-rev30-visual-restore.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/section14-rev30-styles-20260829

      - name: RED - prove section 14 is outside its REV30 scoped wrapper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          ps=sorted(Path('docs/payload').glob('hub-*.txt'))
          s=re.sub(r'\s+','',''.join(p.read_text() for p in ps)); s+='='*(-len(s)%4)
          html=gzip.decompress(base64.b64decode(s)).decode()
          applied=re.search(r'<div\s+class=["\']cw-rev18-late["\']>\s*<section\b(?=[^>]*\bid\s*=\s*["\']alliance-architecture["\'])',html,re.I)
          if applied:
              raise SystemExit('RED test unexpectedly passes: section 14 is already inside cw-rev18-late')
          print('RED_CONFIRMED: section 14 is not inside cw-rev18-late')
          raise SystemExit(1)
          PY
        continue-on-error: true
        id: red

      - name: Require RED to fail for the intended reason
        shell: bash
        run: |
          test '${{ steps.red.outcome }}' = 'failure'
          echo 'RED test failed as expected.'

      - name: Restore exact REV30 wrapped section 14
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,re

          FRAGMENT_SHA='1ae1565acb97bdc3bda7b38d541f7b5d8b1addb77786c5ad35a6dc1b00a2a251'
          STYLE_SHA='621a8c3a61873e4855d13b9aa8937f0a66a21769a30efb1cf726ff1f788cb9a8'
          WRAPPED_SHA='126ba045afa0552f8e6fcf426b144a12b42e534d31ebb8ffac85887053e6eb3d'
          payloads=sorted(Path('docs/payload').glob('hub-*.txt'))
          if len(payloads)!=17: raise SystemExit(f'expected 17 hub chunks, found {len(payloads)}')

          def decode_payload(ps):
              s=re.sub(r'\s+','',''.join(p.read_text(encoding='ascii') for p in ps)); s+='='*(-len(s)%4)
              return gzip.decompress(base64.b64decode(s)).decode('utf-8')

          def span_section(html, element_id):
              m=re.search(r'<section\b(?=[^>]*\bid\s*=\s*["\']'+re.escape(element_id)+r'["\'])[^>]*>',html,re.I)
              if not m: raise RuntimeError('missing section #'+element_id)
              tok=re.compile(r'</?section\b[^>]*>',re.I); depth=0
              for t in tok.finditer(html,m.start()):
                  if t.group(0).startswith('</'):
                      depth-=1
                      if depth==0: return m.start(),t.end(),html[m.start():t.end()]
                  else: depth+=1
              raise RuntimeError('unclosed section #'+element_id)

          baseline=decode_payload(payloads)
          source_b64=Path('docs-governance/recovery/section14-rev30-full-00.b64').read_text(encoding='ascii')
          for p in sorted(Path('docs-governance/recovery').glob('section14-rev30-tail-*.b64')):
              source_b64 += p.read_text(encoding='ascii')
          fragment=gzip.decompress(base64.b64decode(source_b64)).decode('utf-8')
          if hashlib.sha256(fragment.encode()).hexdigest()!=FRAGMENT_SHA: raise RuntimeError('REV30 fragment SHA mismatch')

          sm=re.fullmatch(r'(?s)(<style id="cw-rev18-scoped-styles">.*?</style>)\s*(<div class="cw-rev18-late"><section.*?</section></div>)',fragment)
          if not sm: raise RuntimeError('REV30 fragment shape mismatch')
          source_style,wrapped=sm.group(1),sm.group(2)
          if hashlib.sha256(source_style.encode()).hexdigest()!=STYLE_SHA: raise RuntimeError('source style SHA mismatch')
          if hashlib.sha256(wrapped.encode()).hexdigest()!=WRAPPED_SHA: raise RuntimeError('source wrapped section SHA mismatch')

          # The hub already contains the exact scoped stylesheet. Prove it before relying on it.
          bm=re.search(r'(?s)<style id="cw-rev18-scoped-styles">.*?</style>',baseline)
          if not bm: raise RuntimeError('baseline scoped stylesheet missing')
          baseline_style=bm.group(0)
          bsha=hashlib.sha256(baseline_style.encode()).hexdigest()
          if bsha!=STYLE_SHA: raise RuntimeError(f'baseline scoped stylesheet differs from REV30: {bsha}')

          sa,sb,_=span_section(baseline,'alliance-architecture')
          rs,repl_end=sa,sb
          pre=baseline[:sa]
          wm=re.search(r'<div\s+class=["\']cw-rev18-late["\']>\s*$',pre,re.I)
          if wm:
              post=baseline[sb:]
              cm=re.match(r'\s*</div>',post,re.I)
              if not cm: raise RuntimeError('existing wrapper does not close directly after section')
              rs=wm.start(); repl_end=sb+cm.end()

          candidate=baseline[:rs]+wrapped+baseline[repl_end:]
          if baseline[:rs]!=candidate[:rs]: raise RuntimeError('prefix outside section 14 changed')
          if baseline[repl_end:]!=candidate[rs+len(wrapped):]: raise RuntimeError('suffix outside section 14 changed')

          before_ids=re.findall(r'<section\b[^>]*\bid\s*=\s*["\']([^"\']+)["\']',baseline,re.I)
          after_ids=re.findall(r'<section\b[^>]*\bid\s*=\s*["\']([^"\']+)["\']',candidate,re.I)
          if before_ids!=after_ids: raise RuntimeError('section order changed')
          if candidate.count('id="alliance-architecture"')!=1: raise RuntimeError('section 14 duplicated')
          if candidate.count('id="cw-rev18-scoped-styles"')!=1: raise RuntimeError('scoped style duplicated')
          if wrapped not in candidate: raise RuntimeError('exact REV30 wrapped section not present')

          packed=gzip.compress(candidate.encode('utf-8'),compresslevel=9,mtime=0)
          out=base64.b64encode(packed).decode('ascii')
          n=len(payloads); size=(len(out)+n-1)//n
          chunks=[out[i:i+size] for i in range(0,len(out),size)]
          while len(chunks)<n: chunks.append('')
          if len(chunks)!=n: raise RuntimeError('unexpected payload chunk count')
          for p,c in zip(payloads,chunks): p.write_text(c,encoding='ascii')
          if decode_payload(payloads)!=candidate: raise RuntimeError('payload round-trip mismatch')
          print('RESTORE_PASS')
          print('REV30_style_unchanged='+STYLE_SHA)
          print('REV30_wrapped_section='+WRAPPED_SHA)
          print('outside_section14=BYTE_EXACT')
          PY

      - name: GREEN - require exact REV30 section 14 visual application
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,re
          ps=sorted(Path('docs/payload').glob('hub-*.txt'))
          s=re.sub(r'\s+','',''.join(p.read_text() for p in ps)); s+='='*(-len(s)%4)
          html=gzip.decompress(base64.b64decode(s)).decode()
          applied=re.search(r'<div\s+class=["\']cw-rev18-late["\']>\s*<section\b(?=[^>]*\bid\s*=\s*["\']alliance-architecture["\'])',html,re.I)
          if not applied: raise SystemExit('GREEN failed: wrapper is not applied to section 14')
          sm=re.search(r'(?s)<style id="cw-rev18-scoped-styles">.*?</style>',html)
          if not sm: raise SystemExit('GREEN failed: scoped style missing')
          if hashlib.sha256(sm.group(0).encode()).hexdigest()!='621a8c3a61873e4855d13b9aa8937f0a66a21769a30efb1cf726ff1f788cb9a8': raise SystemExit('GREEN failed: scoped style differs from REV30')
          if html.count('id="cw-rev18-scoped-styles"')!=1 or html.count('id="alliance-architecture"')!=1: raise SystemExit('GREEN failed: duplicate style/section')
          print('GREEN_PASS: exact REV30 visual scope is applied to section 14')
          PY
          changed=$(git diff --name-only)
          test -n "$changed"
          bad=$(printf '%s\n' "$changed" | grep -Ev '^docs/payload/hub-[0-9][0-9]\.txt$' || true)
          test -z "$bad"
          count=$(printf '%s\n' "$changed" | grep -Ec '^docs/payload/hub-[0-9][0-9]\.txt$')
          test "$count" -eq 17

      - name: Commit repaired hub payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/payload/hub-*.txt
          git commit -m 'Apply REV30 visual scope to section 14 exactly'
          git push origin HEAD:fix/section14-rev30-styles-20260829
