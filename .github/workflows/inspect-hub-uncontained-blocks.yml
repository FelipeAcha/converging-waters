name: Inspect hub uncontained blocks
on:
  push:
    branches:
      - fix/hub-accordion-contained-blocks-20260829
    paths:
      - .github/workflows/inspect-hub-uncontained-blocks.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hub-accordion-contained-blocks-20260829
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,re
          d=Path('docs/payload')
          parts=[d/f'hub-{i:02d}.txt' for i in range(17)]
          b64=re.sub(r'\s+','',''.join(p.read_text(encoding='ascii') for p in parts)); b64+='='*(-len(b64)%4)
          html=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          print('HTML_SHA256='+hashlib.sha256(html.encode()).hexdigest())
          terms=['A more tangible field-and-data possibility','Three different questions — keep all three','Territory first, then technical options, then financing fit']
          st=re.compile(r'</?section\b[^>]*>',re.I); sections=[]; stack=[]
          for m in st.finditer(html):
            if m.group(0).lower().startswith('</'):
              if stack:
                sm=stack.pop(); idm=re.search(r'\bid=["\']([^"\']+)["\']',sm.group(0),re.I); sections.append((sm.start(),m.end(),idm.group(1) if idm else ''))
            else: stack.append(m)
          for term in terms:
            pos=html.find(term); containing=[x for x in sections if x[0]<=pos<x[1]]
            prev=list(re.finditer(r'data-cw-section=["\']([^"\']+)["\']',html[:pos])); nxt=re.search(r'data-cw-section=["\']([^"\']+)["\']',html[pos:])
            print('TERM='+term); print('CONTAINING_SECTIONS='+','.join(x[2] for x in containing)); print('PREV_ACCORDION='+(prev[-1].group(1) if prev else 'NONE')); print('NEXT_ACCORDION='+(nxt.group(1) if nxt else 'NONE'))
          helper='''<script>setTimeout(()=>{const ns=['12','13','14','15','16','17','18'];const out=[];for(const n of ns){const b=document.querySelector('.cw-section-accordion[data-cw-section="'+n+'"]>.cw-accordion-trigger');const c=b?.querySelector('.cw-accordion-summary-inner');const l=c?.getBoundingClientRect().left;out.push(n+':'+(Number.isFinite(l)?l.toFixed(1):'NA'));}document.body.dataset.indentDiag=out.join('|');},250);</script>'''
          Path('/tmp/cw-indent.html').write_text(html.replace('</body>',helper+'</body>',1),encoding='utf-8')
          PY
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1920,1080 --virtual-time-budget=3000 --dump-dom file:///tmp/cw-indent.html > /tmp/cw-indent-rendered.html
          grep -o 'data-indent-diag="[^"]*"' /tmp/cw-indent-rendered.html | head -1
