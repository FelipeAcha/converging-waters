name: Surgical hub approved-block recovery

on:
  push:
    branches:
      - fix/hub-restore-approved-blocks-20260829
    paths:
      - scripts/restore_hub_approved_blocks.py
      - tests/test_restore_hub_approved_blocks.py
      - .github/workflows/hub-approved-block-recovery.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: fix/hub-restore-approved-blocks-20260829

      - name: Run preservation regression
        run: |
          set -euo pipefail
          python -m unittest tests.test_restore_hub_approved_blocks

      - name: Generate exact three-region recovery
        run: |
          set -euo pipefail
          python scripts/restore_hub_approved_blocks.py --write --report /tmp/hub-recovery-report.json
          cat /tmp/hub-recovery-report.json

      - name: Fail if any site file outside hub payload changed
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          test -n "$changed"
          echo "$changed"
          bad=$(printf '%s\n' "$changed" | grep -Ev '^docs/payload/hub-[0-9][0-9]\.txt$' || true)
          if [ -n "$bad" ]; then
            echo "Unauthorized changed paths:" >&2
            echo "$bad" >&2
            exit 1
          fi
          count=$(printf '%s\n' "$changed" | grep -Ec '^docs/payload/hub-[0-9][0-9]\.txt$')
          test "$count" -eq 17

      - name: Commit generated hub payload only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/payload/hub-*.txt
          git commit -m 'Restore approved hub infographic and regressed sections'
          git push origin HEAD:fix/hub-restore-approved-blocks-20260829
