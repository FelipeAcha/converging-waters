name: REV33 fetch Wikimedia assets

on:
  push:
    branches:
      - rev33-wikimedia-localization
    paths:
      - .github/workflows/rev33-fetch-wikimedia-assets.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rev33-wikimedia-localization
      - name: Fetch and stage exact precedent images
        shell: bash
        run: |
          set -euo pipefail
          target='docs/candidates/progress/assets/precedents'
          mkdir -p "$target"
          curl -fL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/2/25/Mara%C3%B1%C3%B3n_River_in_2003.jpg' -o "$target/maranon.jpg"
          curl -fL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/b/b4/Lago_Titicaca%2C_Puno%2C_Per%C3%BA%2C_2015-08-01%2C_DD_13.JPG' -o "$target/titicaca.jpg"
          curl -fL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/1/12/Meliponula_ferruginea.jpg' -o "$target/stingless-bee.jpg"
          curl -fL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/c/cb/Whanganui_River.jpg' -o "$target/whanganui.jpg"
          curl -fL --retry 3 --retry-delay 2 'https://upload.wikimedia.org/wikipedia/commons/b/bc/Rio_Atrato.JPG' -o "$target/atrato.jpg"
          sha256sum "$target"/* | tee "$target/SHA256SUMS.txt"
          file "$target"/*
      - name: Commit staged precedent assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/candidates/progress/assets/precedents
          if git diff --cached --quiet; then
            echo 'No asset changes.'
          else
            git commit -m 'Stage REV33 localized precedent assets'
            git push origin HEAD:rev33-wikimedia-localization
          fi
