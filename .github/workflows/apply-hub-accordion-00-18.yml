name: Apply hub accordion 00-18
on:
  push:
    branches:
      - fix/hub-accordion-00-18-20260829
    paths:
      - .github/workflows/apply-hub-accordion-00-18.yml
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/hub-accordion-00-18-20260829
      - name: Build, preserve, and browser-test accordion candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, html, re

          payload_dir = Path('docs/payload')
          parts = [payload_dir / f'hub-{i:02d}.txt' for i in range(17)]
          if not all(p.exists() for p in parts):
              raise SystemExit('Missing hub payload chunk')
          b64 = re.sub(r'\s+', '', ''.join(p.read_text(encoding='ascii') for p in parts))
          b64 += '=' * (-len(b64) % 4)
          baseline = gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          baseline_sha = hashlib.sha256(baseline.encode()).hexdigest()
          expected_sha = '4e88229676854ad35ecee4fa3ed344a0863854e25171493fad78e685aa6ab4fd'
          if baseline_sha != expected_sha:
              raise SystemExit(f'Baseline drift: {baseline_sha}')

          def top_sections(src):
              tok = re.compile(r'</?section\b[^>]*>', re.I)
              stack=[]; out=[]
              for m in tok.finditer(src):
                  if m.group(0).lower().startswith('</'):
                      if not stack: raise RuntimeError('unbalanced section')
                      start, depth = stack.pop()
                      if depth == 0: out.append((start,m.end(),src[start:m.end()]))
                  else:
                      stack.append((m.start(),len(stack)))
              if stack: raise RuntimeError('unclosed section')
              return sorted(out)

          first_target = baseline.index('<section class="section compact-section" id="changed-since">')
          targets=[]
          for a,b,raw in top_sections(baseline):
              if a < first_target: continue
              matches = re.findall(r'<div class="kicker">\s*(\d{2})\s*·\s*([^<]+)</div>',raw,flags=re.I)
              if not matches: continue
              num,title = matches[0]
              targets.append((a,b,raw,num,html.unescape(title.strip())))

          expected_nums=['00','01','02','03','04','01','02','03','04','05','06','07','08','09','10','11','12','13','14','15','16','17','18']
          if [x[3] for x in targets] != expected_nums:
              raise SystemExit('Target sequence drift: '+repr([(x[3],x[4]) for x in targets]))
          if targets[-1][3] != '18':
              raise SystemExit('Final numbered target is not 18')

          style='''<style id="cw-hub-accordion-00-18-styles">
          .cw-section-accordion{margin:0;border:0;border-top:1px solid rgba(19,55,47,.12);background:transparent}
          .cw-section-accordion:last-of-type{border-bottom:1px solid rgba(19,55,47,.12)}
          .cw-section-accordion>summary{list-style:none;cursor:pointer;user-select:none;padding:0;background:rgba(255,253,248,.34);transition:background .18s ease}
          .cw-section-accordion>summary::-webkit-details-marker{display:none}
          .cw-section-accordion>summary:hover{background:rgba(255,253,248,.7)}
          .cw-section-accordion>summary:focus-visible{outline:2px solid var(--gold,#c8952f);outline-offset:-2px}
          .cw-accordion-summary-inner{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:14px;padding-bottom:14px}
          .cw-accordion-label{color:var(--gold,#c8952f);font-weight:950;letter-spacing:.15em;text-transform:uppercase;font-size:.78rem;line-height:1.25}
          .cw-accordion-toggle{width:28px;height:28px;border:1px solid rgba(19,55,47,.14);border-radius:999px;display:grid;place-items:center;font-size:1rem;font-weight:800;line-height:1;color:var(--green,#174d39);background:var(--paper,#fffdf8);transition:transform .24s ease;flex:0 0 auto}
          .cw-section-accordion[open] .cw-accordion-toggle{transform:rotate(45deg)}
          .cw-section-accordion[open]>summary{background:rgba(255,253,248,.56)}
          .cw-accordion-panel{overflow:hidden}
          .cw-accordion-source-label{display:none!important}
          #collaboration-framework>.rev19-observatory-bridge{width:min(1220px,calc(100% - 44px));margin:16px auto 0}
          @media(max-width:900px){.cw-accordion-summary-inner{min-height:58px;padding-top:12px;padding-bottom:12px}.cw-accordion-label{font-size:.72rem}#collaboration-framework>.rev19-observatory-bridge{width:min(100% - 28px,1220px)}}
          @media(prefers-reduced-motion:reduce){.cw-accordion-toggle{transition:none}}
          </style>'''

          script='''<script id="cw-hub-accordion-00-18-script">
          (()=>{
            const all=[...document.querySelectorAll('.cw-section-accordion')];
            if(all.length!==23){console.error('Accordion contract failed: expected 23 existing numbered blocks.');return;}
            all.forEach(details=>{
              const panel=details.querySelector(':scope>.cw-accordion-panel');
              const source=[...panel.querySelectorAll('.kicker')].find(el=>/^\\s*\\d{2}\\s*[·•-]/.test(el.textContent||''));
              if(!source){console.error('Accordion source label missing',details.dataset.cwSection);return;}
              source.classList.add('cw-accordion-source-label');
              source.hidden=true;
              const summary=details.querySelector(':scope>summary');
              const duration=240;
              summary.addEventListener('click',ev=>{
                ev.preventDefault();
                if(details.dataset.animating==='1')return;
                if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){details.open=!details.open;return;}
                details.dataset.animating='1';
                if(details.open){
                  const h=panel.getBoundingClientRect().height;
                  const anim=panel.animate([{height:h+'px',opacity:1},{height:'0px',opacity:0}],{duration,easing:'ease-in-out'});
                  anim.onfinish=()=>{details.open=false;delete details.dataset.animating;};
                  anim.oncancel=()=>{delete details.dataset.animating;};
                }else{
                  details.open=true;
                  const h=panel.scrollHeight;
                  const anim=panel.animate([{height:'0px',opacity:0},{height:h+'px',opacity:1}],{duration,easing:'ease-out'});
                  anim.onfinish=()=>{delete details.dataset.animating;};
                  anim.oncancel=()=>{delete details.dataset.animating;};
                }
              });
            });
          })();
          </script>'''

          def wrap(num,title,raw,idx):
              if idx == 0:
                  title = re.sub(r'\s+since\s+v\s*0\.1\s*$','',title,flags=re.I).strip()
              label = html.escape(f'{num} · {title}')
              return f'<details class="cw-section-accordion" data-cw-section="{num}"><summary><span class="cw-accordion-summary-inner container"><span class="cw-accordion-label">{label}</span><span class="cw-accordion-toggle" aria-hidden="true">+</span></span></summary><div class="cw-accordion-panel">{raw}</div></details>'

          cursor=0; pieces=[]; wrappers=[]
          for idx,(a,b,raw,num,title) in enumerate(targets):
              pieces.append(baseline[cursor:a])
              w=wrap(num,title,raw,idx); wrappers.append((w,raw)); pieces.append(w)
              cursor=b
          pieces.append(baseline[cursor:])
          candidate=''.join(pieces)
          candidate=candidate.replace('</head>',style+'</head>',1).replace('</body>',script+'</body>',1)

          # Exact preservation: remove only the two additions and unwrap exact wrappers.
          restored=candidate.replace(style,'',1).replace(script,'',1)
          for w,raw in wrappers:
              restored=restored.replace(w,raw,1)
          if restored != baseline:
              raise SystemExit('Preservation failure: untouched source did not restore byte-for-byte')
          if candidate.count('class="cw-section-accordion"') != 23:
              raise SystemExit('Expected 23 static accordion wrappers')
          if '<span class="cw-accordion-label">00 · What has changed</span>' not in candidate:
              raise SystemExit('First compact title incorrect')
          if '#collaboration-framework>.rev19-observatory-bridge' not in candidate:
              raise SystemExit('Observatory bridge fix missing')

          helper='''<script>
          setTimeout(()=>{
            const all=[...document.querySelectorAll('.cw-section-accordion')];
            const d0=all[0],s0=d0&&d0.querySelector(':scope>summary');
            const names=all.map(d=>(d.querySelector('.cw-accordion-label')||{}).textContent||'');
            const labels=[...document.querySelectorAll('.cw-accordion-source-label')];
            const collab=document.getElementById('collaboration-framework');
            const dc=collab&&collab.closest('.cw-section-accordion');
            const setup=all.length===23&&labels.length===23&&d0&&s0&&dc;
            if(!setup){document.body.dataset.accordionTest='fail-setup';document.body.dataset.accordionCount=all.length;document.body.dataset.labelCount=labels.length;return;}
            const naming=/^00 · What has changed$/i.test(names[0].trim())&&/^01 · Where we are now$/i.test(names[1].trim());
            const hidden=labels.every(el=>getComputedStyle(el).display==='none');
            dc.open=true;
            const bridge=document.querySelector('#collaboration-framework>.rev19-observatory-bridge');
            const bw=bridge?bridge.getBoundingClientRect().width:0;
            const widthOk=bw>0&&bw<window.innerWidth&&bw<=1221;
            dc.open=false;
            document.body.dataset.namingOk=String(naming);document.body.dataset.hiddenOk=String(hidden);document.body.dataset.widthOk=String(widthOk);document.body.dataset.bridgeWidth=String(Math.round(bw));
            s0.click();
            setTimeout(()=>{
              const opened=d0.open;
              s0.click();
              setTimeout(()=>{
                const closed=!d0.open;
                document.body.dataset.opened=String(opened);document.body.dataset.closed=String(closed);
                document.body.dataset.accordionTest=(naming&&hidden&&widthOk&&opened&&closed)?'pass':'fail-behavior';
              },500);
            },500);
          },180);
          </script>'''
          Path('/tmp/cw-accordion-test.html').write_text(candidate.replace('</body>',helper+'</body>',1),encoding='utf-8')

          encoded=base64.b64encode(gzip.compress(candidate.encode(),compresslevel=9,mtime=0)).decode('ascii')
          size=(len(encoded)+16)//17
          chunks=[encoded[i*size:(i+1)*size] for i in range(16)]+[encoded[16*size:]]
          if len(chunks)!=17 or any(not c for c in chunks): raise SystemExit('chunking failure')
          for i,c in enumerate(chunks): (payload_dir/f'hub-{i:02d}.txt').write_text(c,encoding='ascii')
          rb=''.join((payload_dir/f'hub-{i:02d}.txt').read_text(encoding='ascii') for i in range(17)); rb+='='*(-len(rb)%4)
          if gzip.decompress(base64.b64decode(rb)).decode()!=candidate: raise SystemExit('payload roundtrip mismatch')
          print('SOURCE_PRESERVATION=BYTE_EXACT_AFTER_UNWRAP')
          print('ACCORDION_WRAPPERS=23')
          print('BASELINE_SHA256='+baseline_sha)
          print('CANDIDATE_SHA256='+hashlib.sha256(candidate.encode()).hexdigest())
          PY

          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=3500 --dump-dom "file:///tmp/cw-accordion-test.html" > /tmp/cw-accordion-rendered.html
          grep -o '<body[^>]*>' /tmp/cw-accordion-rendered.html | head -1 || true
          grep -q 'data-accordion-test="pass"' /tmp/cw-accordion-rendered.html
          test "$(grep -o 'class="cw-section-accordion"' /tmp/cw-accordion-rendered.html | wc -l | tr -d ' ')" = 23
          echo 'BROWSER_ACCORDION_OPEN_CLOSE=PASS'
          echo 'BROWSER_DUPLICATE_LABEL_SUPPRESSION=PASS'
          echo 'BROWSER_OBSERVATORY_BRIDGE_WIDTH=PASS'
      - name: Commit only production hub payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/payload/hub-*.txt
          git commit -m 'Apply accordion navigation across numbered hub sections'
          git push origin HEAD:fix/hub-accordion-00-18-20260829
