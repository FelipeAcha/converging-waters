name: Apply hub accordion 00-18
on:
  push:
    branches:
      - fix/hub-accordion-00-18-20260829
    paths:
      - .github/workflows/apply-hub-accordion-00-18.yml
permissions:
  contents: write
jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/hub-accordion-00-18-20260829
      - name: Build, preserve, and browser-test accordion candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, html, re

          payload_dir=Path('docs/payload')
          parts=[payload_dir/f'hub-{i:02d}.txt' for i in range(17)]
          if not all(p.exists() for p in parts): raise SystemExit('Missing hub payload chunk')
          b64=re.sub(r'\s+','',''.join(p.read_text(encoding='ascii') for p in parts)); b64+='='*(-len(b64)%4)
          baseline=gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          baseline_sha=hashlib.sha256(baseline.encode()).hexdigest()
          if baseline_sha!='4e88229676854ad35ecee4fa3ed344a0863854e25171493fad78e685aa6ab4fd': raise SystemExit('Baseline drift: '+baseline_sha)

          def top_sections(src):
              tok=re.compile(r'</?section\b[^>]*>',re.I); stack=[]; out=[]
              for m in tok.finditer(src):
                  if m.group(0).lower().startswith('</'):
                      if not stack: raise RuntimeError('unbalanced section')
                      start,depth=stack.pop()
                      if depth==0: out.append((start,m.end(),src[start:m.end()]))
                  else: stack.append((m.start(),len(stack)))
              if stack: raise RuntimeError('unclosed section')
              return sorted(out)

          first=baseline.index('<section class="section compact-section" id="changed-since">')
          targets=[]
          for a,b,raw in top_sections(baseline):
              if a<first: continue
              matches=re.findall(r'<div class="kicker">\s*(\d{2})\s*·\s*([^<]+)</div>',raw,flags=re.I)
              if matches:
                  num,title=matches[0]; targets.append((a,b,raw,num,html.unescape(title.strip())))
          expected=['00','01','02','03','04','01','02','03','04','05','06','07','08','09','10','11','12','13','14','15','16','17','18']
          if [x[3] for x in targets]!=expected: raise SystemExit('Target sequence drift')

          style='''<style id="cw-hub-accordion-00-18-styles">
          .cw-section-accordion{margin:0;border:0;border-top:1px solid rgba(19,55,47,.12);background:transparent}
          .cw-section-accordion:last-of-type{border-bottom:1px solid rgba(19,55,47,.12)}
          .cw-accordion-trigger{width:100%;border:0;border-radius:0;margin:0;padding:0;appearance:none;text-align:left;font:inherit;color:inherit;cursor:pointer;background:rgba(255,253,248,.34);transition:background .18s ease}
          .cw-accordion-trigger:hover{background:rgba(255,253,248,.7)}
          .cw-accordion-trigger:focus-visible{outline:2px solid var(--gold,#c8952f);outline-offset:-2px}
          .cw-accordion-summary-inner{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:18px;padding-top:14px;padding-bottom:14px}
          .cw-accordion-label{color:var(--gold,#c8952f);font-weight:950;letter-spacing:.15em;text-transform:uppercase;font-size:.78rem;line-height:1.25}
          .cw-accordion-toggle{width:28px;height:28px;border:1px solid rgba(19,55,47,.14);border-radius:999px;display:grid;place-items:center;font-size:1rem;font-weight:800;line-height:1;color:var(--green,#174d39);background:var(--paper,#fffdf8);transition:transform .24s ease;flex:0 0 auto}
          .cw-section-accordion.is-open .cw-accordion-toggle{transform:rotate(45deg)}
          .cw-section-accordion.is-open>.cw-accordion-trigger{background:rgba(255,253,248,.56)}
          .cw-accordion-panel{overflow:hidden}
          .cw-accordion-source-label{display:none!important}
          #collaboration-framework>.rev19-observatory-bridge{width:min(1220px,calc(100% - 44px));margin:16px auto 0}
          @media(max-width:900px){.cw-accordion-summary-inner{min-height:58px;padding-top:12px;padding-bottom:12px}.cw-accordion-label{font-size:.72rem}#collaboration-framework>.rev19-observatory-bridge{width:min(100% - 28px,1220px)}}
          @media(prefers-reduced-motion:reduce){.cw-accordion-toggle,.cw-accordion-trigger{transition:none}}
          </style>'''

          script='''<script id="cw-hub-accordion-00-18-script">
          (()=>{
            const all=[...document.querySelectorAll('.cw-section-accordion')];
            if(all.length!==23){console.error('Accordion contract failed.');return;}
            const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            all.forEach(box=>{
              const button=box.querySelector(':scope>.cw-accordion-trigger');
              const panel=box.querySelector(':scope>.cw-accordion-panel');
              const source=[...panel.querySelectorAll('.kicker')].find(el=>/^\\s*\\d{2}\\s*[·•-]/.test(el.textContent||''));
              if(!button||!panel||!source){console.error('Accordion source missing',box.dataset.cwSection);return;}
              source.classList.add('cw-accordion-source-label'); source.hidden=true;
              const finishOpen=()=>{panel.style.height='';panel.style.opacity='';panel.style.transition='';delete box.dataset.animating;};
              const finishClose=()=>{panel.hidden=true;panel.style.height='';panel.style.opacity='';panel.style.transition='';delete box.dataset.animating;};
              button.addEventListener('click',()=>{
                if(box.dataset.animating==='1')return;
                const opening=button.getAttribute('aria-expanded')!=='true';
                if(reduced){
                  button.setAttribute('aria-expanded',String(opening));box.classList.toggle('is-open',opening);panel.hidden=!opening;return;
                }
                box.dataset.animating='1';
                if(opening){
                  panel.hidden=false;button.setAttribute('aria-expanded','true');box.classList.add('is-open');
                  panel.style.height='0px';panel.style.opacity='0';panel.style.transition='none';panel.getBoundingClientRect();
                  const h=panel.scrollHeight;
                  panel.style.transition='height 240ms ease-out, opacity 200ms ease-out';
                  requestAnimationFrame(()=>{panel.style.height=h+'px';panel.style.opacity='1';});
                  setTimeout(finishOpen,280);
                }else{
                  button.setAttribute('aria-expanded','false');box.classList.remove('is-open');
                  const h=panel.getBoundingClientRect().height||panel.scrollHeight;
                  panel.style.height=h+'px';panel.style.opacity='1';panel.style.transition='none';panel.getBoundingClientRect();
                  panel.style.transition='height 240ms ease-in-out, opacity 180ms ease-in';
                  requestAnimationFrame(()=>{panel.style.height='0px';panel.style.opacity='0';});
                  setTimeout(finishClose,280);
                }
              });
            });
          })();
          </script>'''

          def wrap(num,title,raw,idx):
              if idx==0: title=re.sub(r'\s+since\s+v\s*0\.1\s*$','',title,flags=re.I).strip()
              label=html.escape(f'{num} · {title}'); pid=f'cw-accordion-panel-{idx:02d}'
              return f'<div class="cw-section-accordion" data-cw-section="{num}"><button class="cw-accordion-trigger" type="button" aria-expanded="false" aria-controls="{pid}"><span class="cw-accordion-summary-inner container"><span class="cw-accordion-label">{label}</span><span class="cw-accordion-toggle" aria-hidden="true">+</span></span></button><div class="cw-accordion-panel" id="{pid}" hidden>{raw}</div></div>'

          cursor=0; pieces=[]; wrappers=[]
          for idx,(a,b,raw,num,title) in enumerate(targets):
              pieces.append(baseline[cursor:a]); w=wrap(num,title,raw,idx); wrappers.append((w,raw)); pieces.append(w); cursor=b
          pieces.append(baseline[cursor:]); candidate=''.join(pieces)
          candidate=candidate.replace('</head>',style+'</head>',1).replace('</body>',script+'</body>',1)

          restored=candidate.replace(style,'',1).replace(script,'',1)
          for w,raw in wrappers: restored=restored.replace(w,raw,1)
          if restored!=baseline: raise SystemExit('Preservation failure: baseline not restored byte-for-byte')
          if candidate.count('class="cw-section-accordion"')!=23: raise SystemExit('Wrapper count failure')
          if '<span class="cw-accordion-label">00 · What has changed</span>' not in candidate: raise SystemExit('First title failure')
          if '#collaboration-framework>.rev19-observatory-bridge' not in candidate: raise SystemExit('Width fix missing')

          helper='''<script>
          setTimeout(()=>{
            const all=[...document.querySelectorAll('.cw-section-accordion')], b0=all[0]?.querySelector('.cw-accordion-trigger');
            const names=all.map(x=>x.querySelector('.cw-accordion-label')?.textContent||'');
            const labels=[...document.querySelectorAll('.cw-accordion-source-label')];
            const collab=document.getElementById('collaboration-framework'), bc=collab?.closest('.cw-section-accordion')?.querySelector('.cw-accordion-trigger');
            const setup=all.length===23&&labels.length===23&&b0&&bc;
            if(!setup){document.body.dataset.accordionTest='fail-setup';document.body.dataset.count=all.length;document.body.dataset.labels=labels.length;return;}
            const naming=/^00 · What has changed$/i.test(names[0].trim())&&/^01 · Where we are now$/i.test(names[1].trim());
            const hidden=labels.every(el=>getComputedStyle(el).display==='none');
            bc.click();
            setTimeout(()=>{
              const bridge=document.querySelector('#collaboration-framework>.rev19-observatory-bridge'), bw=bridge?.getBoundingClientRect().width||0;
              const widthOk=bw>0&&bw<window.innerWidth&&bw<=1221;
              bc.click();
              b0.click();
              setTimeout(()=>{
                const opened=b0.getAttribute('aria-expanded')==='true'&&!b0.parentElement.querySelector('.cw-accordion-panel').hidden;
                b0.click();
                setTimeout(()=>{
                  const closed=b0.getAttribute('aria-expanded')==='false'&&b0.parentElement.querySelector('.cw-accordion-panel').hidden;
                  Object.assign(document.body.dataset,{namingOk:String(naming),hiddenOk:String(hidden),widthOk:String(widthOk),bridgeWidth:String(Math.round(bw)),opened:String(opened),closed:String(closed),accordionTest:(naming&&hidden&&widthOk&&opened&&closed)?'pass':'fail-behavior'});
                },380);
              },380);
            },380);
          },160);
          </script>'''
          Path('/tmp/cw-accordion-test.html').write_text(candidate.replace('</body>',helper+'</body>',1),encoding='utf-8')

          encoded=base64.b64encode(gzip.compress(candidate.encode(),compresslevel=9,mtime=0)).decode('ascii'); size=(len(encoded)+16)//17
          chunks=[encoded[i*size:(i+1)*size] for i in range(16)]+[encoded[16*size:]]
          if len(chunks)!=17 or any(not c for c in chunks): raise SystemExit('chunking failure')
          for i,c in enumerate(chunks): (payload_dir/f'hub-{i:02d}.txt').write_text(c,encoding='ascii')
          rb=''.join((payload_dir/f'hub-{i:02d}.txt').read_text(encoding='ascii') for i in range(17)); rb+='='*(-len(rb)%4)
          if gzip.decompress(base64.b64decode(rb)).decode()!=candidate: raise SystemExit('roundtrip failure')
          print('SOURCE_PRESERVATION=BYTE_EXACT_AFTER_UNWRAP')
          print('ACCORDION_WRAPPERS=23')
          print('BASELINE_SHA256='+baseline_sha)
          print('CANDIDATE_SHA256='+hashlib.sha256(candidate.encode()).hexdigest())
          PY

          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          test -n "$chrome"
          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom "file:///tmp/cw-accordion-test.html" > /tmp/cw-accordion-rendered.html
          grep -o '<body[^>]*>' /tmp/cw-accordion-rendered.html | head -1 || true
          grep -q 'data-accordion-test="pass"' /tmp/cw-accordion-rendered.html
          test "$(grep -o 'class="cw-section-accordion"' /tmp/cw-accordion-rendered.html | wc -l | tr -d ' ')" = 23
          echo 'BROWSER_ACCORDION_OPEN_CLOSE=PASS'
          echo 'BROWSER_DUPLICATE_LABEL_SUPPRESSION=PASS'
          echo 'BROWSER_OBSERVATORY_BRIDGE_WIDTH=PASS'
      - name: Commit only production hub payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/payload/hub-*.txt
          git commit -m 'Apply accordion navigation across numbered hub sections'
          git push origin HEAD:fix/hub-accordion-00-18-20260829
