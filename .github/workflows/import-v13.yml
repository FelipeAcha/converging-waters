name: Publish reviewed Converging Waters v13

on:
  push:
    branches: [main]
    paths:
      - '.github/run-v13-import'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import and validate reviewed package
        run: |
          set -euo pipefail
          test -f converging-waters-repository-ready.zip
          echo 'cf0a0e2f78ccf0ca370735c285cb1cbe19515c44bffabbb87424a0cda7efafb1  converging-waters-repository-ready.zip' | sha256sum --check --strict
          rm -rf /tmp/cw-v13
          mkdir -p /tmp/cw-v13
          unzip -q converging-waters-repository-ready.zip -d /tmp/cw-v13
          rm -rf docs/releases/v13 docs/preview
          mkdir -p docs/releases docs
          rsync -a /tmp/cw-v13/ ./
          rm -f converging-waters-repository-ready.zip .github/run-v13-import .github/import-trigger
          python scripts/validate_site.py
          test -f docs/index.html
          test -f docs/preview/index.html
          test -f docs/releases/v13/index.html
          test -f docs/releases/v13/asset-manifest.json

      - name: Commit reviewed package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish reviewed Converging Waters v13'
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public routes and release assets
        run: |
          set -euo pipefail
          for url in \
            'https://felipeacha.github.io/converging-waters/' \
            'https://felipeacha.github.io/converging-waters/preview/' \
            'https://felipeacha.github.io/converging-waters/releases/v13/' \
            'https://felipeacha.github.io/converging-waters/releases/v13/asset-manifest.json'; do
            code=000
            for attempt in $(seq 1 36); do
              code=$(curl -L --silent --show-error --output /tmp/cw-response --write-out '%{http_code}' "$url" || true)
              if [ "$code" = 200 ] && [ -s /tmp/cw-response ]; then
                break
              fi
              sleep 5
            done
            test "$code" = 200
            test -s /tmp/cw-response
            echo "PASS $url"
          done

      - name: Record successful publication
        run: |
          set -euo pipefail
          cat > .github/v13-publication-status.json <<JSON
          {
            "status": "success",
            "run_id": "${GITHUB_RUN_ID}",
            "source_sha": "${GITHUB_SHA}",
            "page_url": "${{ steps.deployment.outputs.page_url }}",
            "root_url": "https://felipeacha.github.io/converging-waters/",
            "preview_url": "https://felipeacha.github.io/converging-waters/preview/",
            "release_url": "https://felipeacha.github.io/converging-waters/releases/v13/"
          }
          JSON
          git add .github/v13-publication-status.json
          git commit -m 'Record successful Converging Waters v13 publication'
          git push origin HEAD:main
