name: Import and deploy repository-ready package

on:
  push:
    branches: [main]
    paths:
      - 'converging-waters-repository-ready.zip'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  import-validate-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout independent repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify package is present
        run: test -f converging-waters-repository-ready.zip

      - name: Extract package incrementally
        run: |
          set -euo pipefail
          rm -rf /tmp/converging-waters-package
          mkdir -p /tmp/converging-waters-package
          unzip -q converging-waters-repository-ready.zip -d /tmp/converging-waters-package

          # Replace only the controlled website candidates. Preserve repository
          # history, personal workflows and governance files outside these paths.
          rm -rf docs/releases/v13 docs/preview
          mkdir -p docs/releases docs
          rsync -a /tmp/converging-waters-package/ ./
          rm converging-waters-repository-ready.zip

      - name: Validate website and repository package
        run: |
          set -euo pipefail
          python scripts/validate_site.py
          python - <<'PY'
          from pathlib import Path
          required = [
              Path('README.md'), Path('GOVERNANCE.md'), Path('CHANGELOG.md'),
              Path('docs/index.html'), Path('docs/preview/index.html'),
              Path('docs/releases/v13/index.html'),
              Path('docs/releases/v13/asset-manifest.json'),
              Path('docs-governance/DECISIONS.md'),
              Path('docs-governance/standards/WEB_PREVIEW_AND_PUBLISHING.md'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit('Missing required files: ' + ', '.join(missing))
          print('PASS: repository package structure')
          PY

      - name: Commit imported package
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import optimized Converging Waters v13 package'
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload validated Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy validated site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
